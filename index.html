<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de Fuerza ATR — Atletismo Nayarit (Micros 6-12 Potencia)</title>
<style>
  :root{
    --bg:#0A0D12; --surface:#12161D; --surface2:#1A2029; --surface3:#212836;
    --line:#2A3140; --text:#EDEFF3; --muted:#8B94A3; --muted2:#5C6472;
    --lane:#E2452C; --acum:#3B82F6; --trans:#E2452C; --real:#F2B705; --ok:#37C77F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
  #root{min-height:100vh;}
  .mono{font-family:'Courier New',Courier,monospace;}
  .display{font-family:'Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .app{max-width:1280px;margin:0 auto;padding:20px 16px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 180deg, var(--lane), #7A1E12, var(--lane));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .brand-title{font-weight:700;font-size:19px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap;gap:8px;}
  .section-title{font-weight:700;font-size:15px;letter-spacing:0.03em;text-transform:uppercase;}
  .section-note{font-size:12px;color:var(--muted);}
  .picker-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;justify-content:space-between;}
  select{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;}
  .day-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;}
  .day-head{background:var(--surface2);padding:12px 16px;font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;padding:8px 12px;border-bottom:1px solid var(--line);}
  td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .ex-name{font-weight:700;}
  .ex-plano{font-size:10.5px;color:var(--muted);}
  .ex-enfasis{font-size:9px;color:#E2B86A;font-style:italic;margin-top:2px;}
  .load-pill{font-family:'Courier New',monospace;font-weight:700;background:var(--surface3);padding:3px 8px;border-radius:6px;display:inline-block;white-space:nowrap;}
  .rest-msg{text-align:center;padding:40px 20px;color:var(--muted);}
  .cal-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
  .cal-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
  .cal-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;}
  .cal-value{font-family:'Courier New',monospace;font-size:14px;font-weight:700;margin-top:3px;}
  .footer-note{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted2);line-height:1.6;}
  .rm-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;}
  input[type=number]{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:'Courier New',monospace;font-size:13px;width:110px;}
  .btn{background:var(--lane);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;}
  .btn.big{padding:12px 22px;font-size:13px;}
  .highlight-rfd{background:#3A2A1A;padding:4px 8px;border-radius:4px;border-left:3px solid #E2B86A;}
  .cometti-block{background:linear-gradient(135deg, #3A2A1A, #2A2015);border:2px solid #E2B86A;border-radius:10px;padding:16px;margin:16px 0;color:#FFE;font-family:'Courier New',monospace;}
  .cometti-title{font-weight:700;font-size:12px;color:#FFE;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:8px;}
  .cometti-step{font-size:11px;margin:4px 0;line-height:1.4;}
  .micro-info{font-size:10px;color:var(--muted);margin-top:8px;padding:8px;background:var(--surface3);border-radius:6px;}

  @media (max-width:640px){
    .brand-title{font-size:16px;}
    .app{padding:14px 10px 50px;}
    table{border:none;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    td{padding:8px 6px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// CONSTANTES Y DATOS BASE
// ═══════════════════════════════════════════════════════════════════════════

const ROSTER = [
  {name:"Atleta 1", halterKg:80, squatKg:140, benchKg:90, halterReps:3},
  {name:"Atleta 2", halterKg:75, squatKg:135, benchKg:85, halterReps:3},
  {name:"Atleta 3", halterKg:85, squatKg:150, benchKg:95, halterReps:3},
];

const CALENDAR = [
  {micro:1, fase:"Acum", fechas:"07-13 sep", title:"Adaptación Anatómica", sqBw:0.65, bnBw:0.65, hBw:0.60},
  {micro:2, fase:"Acum", fechas:"14-20 sep", title:"Hipertrofia-Fuerza", sqBw:0.72, bnBw:0.72, hBw:0.65},
  {micro:3, fase:"Acum", fechas:"21-27 sep", title:"Fuerza Máxima I", sqBw:0.80, bnBw:0.80, hBw:0.70},
  {micro:4, fase:"Acum", fechas:"28sep-4oct", title:"Fuerza Máxima II", sqBw:0.85, bnBw:0.85, hBw:0.75},
  {micro:5, fase:"Acum", fechas:"05-11 oct", title:"Recuperación", sqBw:0.70, bnBw:0.70, hBw:0.65},
  {micro:6, fase:"Acum", fechas:"12-18 oct", title:"Pico Acum. → POTENCIA", sqBw:0.90, bnBw:0.88, hBw:0.80},
  {micro:7, fase:"Trans", fechas:"19-25 oct", title:"Carga/Potencia I", sqBw:0.70, bnBw:0.65, hBw:0.75},
  {micro:8, fase:"Trans", fechas:"26oct-1nov", title:"Impacto/PAP 85%", sqBw:0.85, bnBw:0.80, hBw:0.82},
  {micro:9, fase:"Trans", fechas:"02-08 nov", title:"Carga/Halterofilia", sqBw:0.75, bnBw:0.70, hBw:0.80},
  {micro:10, fase:"Trans", fechas:"09-15 nov", title:"Específico/RFD", sqBw:0.65, bnBw:0.65, hBw:0.70},
  {micro:11, fase:"Real", fechas:"16-22 nov", title:"Puesta a Punto", sqBw:0.50, bnBw:0.50, hBw:0.55},
  {micro:12, fase:"Real", fechas:"23-29 nov", title:"Competición", sqBw:0.40, bnBw:0.40, hBw:0.45},

// ═══════════════════════════════════════════════════════════════════════════
// SELECTORES DE VARIANTES POR MICROCICLO
// ═══════════════════════════════════════════════════════════════════════════

const selectSquatVariant = (micro) => {
  if(micro <= 2) return {nombre:"Sentadilla - Técnica", enfasis:"Rango completo, patrón correcto", series:"3 × 6 reps"};
  if(micro <= 4) return {nombre:"Sentadilla - Fuerza Máxima", enfasis:"Máxima tensión", series:"4 × 3-4 reps"};
  if(micro === 5) return {nombre:"Sentadilla - Recuperación", enfasis:"Sin fatiga", series:"3 × 5 reps"};
  if(micro <= 10) return {nombre:"Sentadilla Explosiva", enfasis:"RFD MÁXIMA - Salida de tacos", series:"4 × 2-3 reps [EXPLOSIVO]"};
  return {nombre:"Sentadilla - Activación", enfasis:"Patrón limpio", series:"2 × 3 reps"};
};

const selectRDLVariant = (micro) => {
  if(micro <= 2) return {nombre:"RDL - Técnica", enfasis:"Rango completo, control", series:"3 × 6 reps"};
  if(micro <= 4) return {nombre:"RDL - Fuerza Máxima", enfasis:"Máxima tensión", series:"4 × 3-4 reps"};
  if(micro === 5) return {nombre:"RDL - Recuperación", enfasis:"Sin fatiga", series:"3 × 5 reps"};
  if(micro <= 10) return {nombre:"RDL Explosivo", enfasis:"RFD MÁXIMA - Cadena posterior potencia", series:"4 × 2-3 reps [EXPLOSIVO]"};
  return {nombre:"RDL - Activación", enfasis:"Patrón limpio", series:"2 × 3 reps"};
};

const selectSnatchVariant = (micro) => {
  if(micro <= 2) return {nombre:"Snatch - Técnica", enfasis:"Patrón motor", series:"3 × 4 reps"};
  if(micro <= 4) return {nombre:"Snatch - Fuerza", enfasis:"Máxima fuerza", series:"4 × 3-4 reps @ 80%"};
  if(micro === 5) return {nombre:"Snatch - Recuperación", enfasis:"Técnica", series:"3 × 4 reps"};
  if(micro <= 10) return {nombre:"Power Snatch - EXPLOSIVO [⭐ TRANSFERENCIA]", enfasis:"TRIPLE EXTENSIÓN = Aceleración 0-30m", series:"4 × 2-3 @ 75% [EXPLOSIVO MÁXIMO]"};
  return {nombre:"Snatch - Activación", enfasis:"Patrón motor limpio", series:"2 × 3 reps"};
};

const selectCleanVariant = (micro) => {
  if(micro <= 2) return {nombre:"Clean - Técnica", enfasis:"Patrón motor", series:"3 × 4 reps"};
  if(micro <= 4) return {nombre:"Clean - Fuerza", enfasis:"Máxima fuerza", series:"4 × 3-4 reps @ 80%"};
  if(micro === 5) return {nombre:"Clean - Recuperación", enfasis:"Técnica", series:"3 × 4 reps"};
  if(micro <= 10) return {nombre:"Power Clean + Press - EXPLOSIVO [⭐ TRANSFERENCIA]", enfasis:"SINCRONIZACIÓN piernas-brazos integrada", series:"3 × 2-3 @ 75% [COMBI POTENCIA]"};
  return {nombre:"Clean - Activación", enfasis:"Patrón motor limpio", series:"2 × 3 reps"};
};

const selectJumpSquatVariant = (micro) => {
  if(micro <= 4) return {nombre:"Jump Squat - Técnica", enfasis:"Aprendizaje patrón explosivo", series:"3 × 4 reps"};
  if(micro === 5) return {nombre:"Jump Squat - Recuperación", enfasis:"Ligero", series:"2 × 4 reps"};
  if(micro <= 10) return {nombre:"Jump Squat Explosivo", enfasis:"Máxima altura, potencia cuádriceps, energía elástica", series:"4 × 3-4 reps [EXPLOSIVO]"};
  return {nombre:"Jump Squat - Activación", enfasis:"Coordinación ligera", series:"2 × 3 reps"};
};

const selectCurlVariant = (micro) => {
  if(micro <= 2) return {nombre:"Curl Barra EZ - Técnica", enfasis:"Técnica, rango completo", series:"3 × 8-10 reps"};
  if(micro <= 4) return {nombre:"Curl Barra EZ - Fuerza", enfasis:"Máxima fuerza bíceps", series:"4 × 4-6 reps"};
  if(micro === 5) return {nombre:"Curl Barra EZ - Recuperación", enfasis:"Sin fatiga", series:"3 × 6 reps"};
  if(micro <= 10) return {nombre:"Curl Barra EZ Explosivo", enfasis:"Máxima velocidad, POTENCIA ciclo braceo", series:"3 × 4-6 reps @ 70% [EXPLOSIVO]"};
  return {nombre:"Curl Barra EZ - Activación", enfasis:"Patrón limpio", series:"2 × 4 reps"};
};

const selectTricepsVariant = (micro) => {
  if(micro <= 2) return {nombre:"Tricep Ext - Técnica", enfasis:"Rango completo", series:"3 × 8-10 reps"};
  if(micro <= 4) return {nombre:"Tricep Ext - Fuerza", enfasis:"Máxima fuerza extensión", series:"4 × 4-6 reps"};
  if(micro === 5) return {nombre:"Tricep Ext - Recuperación", enfasis:"Sin fatiga", series:"3 × 6 reps"};
  if(micro <= 10) return {nombre:"Tricep Ext Explosivo", enfasis:"Máxima velocidad extensión, swing atrás", series:"4 × 3-4 @ 75% [EXPLOSIVO]"};
  return {nombre:"Tricep Ext - Activación", enfasis:"Patrón limpio", series:"2 × 3 reps"};
};

const selectRemoVariant = (micro) => {
  if(micro <= 2) return {nombre:"Remo Barra - Técnica", enfasis:"Control máximo", series:"3 × 6-8 reps"};
  if(micro <= 4) return {nombre:"Remo Barra - Fuerza", enfasis:"Máxima fuerza tracción", series:"4 × 3-4 reps"};
  if(micro === 5) return {nombre:"Remo Barra - Recuperación", enfasis:"Sin fatiga", series:"3 × 6 reps"};
  if(micro <= 10) return {nombre:"Remo Barra Explosivo", enfasis:"RFD MÁXIMA - Tracción rápida swing atrás", series:"4 × 2-3 @ 75% [RFD MÁXIMA]"};
  return {nombre:"Remo Barra - Activación", enfasis:"Patrón limpio", series:"2 × 3 reps"};
};

const selectPectoralVariant = (micro) => {
  if(micro <= 2) return {nombre:"Press Pecho - Técnica", enfasis:"Rango completo", series:"3 × 8-10 reps"};
  if(micro <= 4) return {nombre:"Press Pecho - Fuerza", enfasis:"Máxima fuerza empuje", series:"4 × 3-4 reps"};
  if(micro === 5) return {nombre:"Press Pecho - Recuperación", enfasis:"Sin fatiga", series:"3 × 6 reps"};
  if(micro <= 10) return {nombre:"Press Pecho Explosivo", enfasis:"Máxima velocidad empuje, swing adelante", series:"3 × 4-5 @ 70% [EXPLOSIVO]"};
  return {nombre:"Press Pecho - Activación", enfasis:"Patrón limpio", series:"2 × 3 reps"};
};

const selectDeltoidesVariant = (micro) => {
  if(micro <= 2) return {nombre:"Press Militar - Técnica", enfasis:"Patrón motor correcto", series:"3 × 6-8 reps"};
  if(micro <= 4) return {nombre:"Press Militar - Fuerza", enfasis:"Máxima fuerza", series:"4 × 3-4 reps"};
  if(micro === 5) return {nombre:"Press Militar - Recuperación", enfasis:"Sin fatiga", series:"3 × 6 reps"};
  if(micro <= 10) return {nombre:"Press Militar Explosivo", enfasis:"Potencia tren superior, COORDINACIÓN brazo-pierna", series:"3 × 3-4 @ 70% [EXPLOSIVO]"};
  return {nombre:"Press Militar - Activación", enfasis:"Patrón motor limpio", series:"2 × 3 reps"};
};

const selectSoleoVariant = (micro) => {
  if(micro <= 2) return {nombre:"Calf Raises - Adaptación", enfasis:"Rango completo, patrón motor", series:"3 × 12-15 reps"};
  if(micro <= 4) return {nombre:"Single-Leg Calf - FM", enfasis:"Máxima tensión, excéntrico 4s", series:"4 × 6-8 reps/pierna @ 85%"};
  if(micro === 5) return {nombre:"Calf Raises - Recuperación", enfasis:"Sin fatiga", series:"3 × 10 reps"};
  if(micro <= 10) return {nombre:"Single-Leg Calf - EXPLOSIVO [RFD]", enfasis:"Máxima velocidad, explosividad pura", series:"4 × 6-8 reps/pierna @ 75% [EXPLOSIVO]"};
  return {nombre:"Calf Raises - Activación", enfasis:"Patrón motor limpio", series:"2 × 4 reps"};
};

const selectJumpCalfVariant = (micro) => {
  if(micro <= 2) return {nombre:"Jump Calf - Coordinación", enfasis:"Aprendizaje patrón", series:"3 × 5-6 reps"};
  if(micro <= 4) return {nombre:"Jump Calf - Control", enfasis:"Explosividad controlada", series:"3 × 5-6 reps"};
  if(micro === 5) return {nombre:"Jump Calf - Recuperación", enfasis:"Muy ligero", series:"2 × 5 reps"};
  if(micro <= 10) return {nombre:"Jump Calf - MÁXIMA RFD [⭐ CRÍTICO]", enfasis:"Máxima altura, explosividad pura, energía elástica", series:"4 × 4-6 reps @ 80% [EXPLOSIVO]"};
  return {nombre:"Jump Calf - Activación", enfasis:"Coordinación ligera", series:"2 × 4 reps"};
};

const selectComettiVariant = (micro) => {
  if(micro >= 6 && micro <= 10) {
    return {
      nombre:"COMETTI FRANCÉS - TRANSFERENCIA MÁXIMA [⭐ CRÍTICO]",
      enfasis:"Conversión fuerza máxima → velocidad sprint 100m",
      estructura:"Squat 80% → Salto Vertical → Drop Jump → Sprint 15m",
      series:"3-4 ciclos completos",
      pausa:"3-4 minutos entre ciclos",
      rpe:"9/10 (máximo esfuerzo)",
      objetivo:"MÁXIMA TRANSFERENCIA a aceleración 0-30m"
    };
  }
  return {nombre:"COMETTI No incluido", enfasis:"Solo Micros 6-10", estructura:"—"};
};

// ═══════════════════════════════════════════════════════════════════════════
// FUNCIONES DE CÁLCULO DE CARGA
// ═══════════════════════════════════════════════════════════════════════════

function epley(kg, reps) {
  if(reps === 1) return kg;
  return kg * (36 / (37 - reps));
}

function loadFor(ex, a) {
  if(!a) return "—";
  const b = (ex.base === "squat") ? a.squatKg : (ex.base === "bench") ? a.benchKg : (ex.base === "halter") ? a.halterKg : null;
  if(!b) return "—";
  const rm = (ex.base === "halter") ? epley(b, a.halterReps) : b;
  return Math.round(rm * (ex.pct || 0.75));
}

// ═══════════════════════════════════════════════════════════════════════════
// FUNCIONES DE DÍAS (LUNES A VIERNES) - REESTRUCTURADAS MICROS 6-12
// ═══════════════════════════════════════════════════════════════════════════

function MONDAY(cal) {
  const squat = selectSquatVariant(cal.micro);
  const rdl = selectRDLVariant(cal.micro);
  const jumpSquat = selectJumpSquatVariant(cal.micro);
  const snatch = selectSnatchVariant(cal.micro);
  const clean = selectCleanVariant(cal.micro);
  const curl = selectCurlVariant(cal.micro);
  const remo = selectRemoVariant(cal.micro);
  const deltoides = selectDeltoidesVariant(cal.micro);
  
  return [
    {plano:"Cuádriceps (Potencia I) ⚡", nombre:squat.nombre, enfasis:squat.enfasis, series:squat.series, pct:cal.sqBw, base:"squat"},
    {plano:"Cuádriceps (Jump Squat) ⚡", nombre:jumpSquat.nombre, enfasis:jumpSquat.enfasis, series:jumpSquat.series, pct:0.70, base:"fixed"},
    {plano:"Isquios (Potencia I) ⚡", nombre:rdl.nombre, enfasis:rdl.enfasis, series:rdl.series, pct:cal.sqBw*0.70, base:"squat"},
    {plano:"Isquios (Good Morning) ⚡", nombre:"Good Morning Explosivo", enfasis:"Potencia cadena posterior integrada", series:cal.micro >= 6 ? "3 × 3-4 [EXPLOSIVO]" : "3 × 6 reps", pct:0.70, base:"squat"},
    {plano:"Halterofilia Potencia I: Snatch ⭐", nombre:snatch.nombre, enfasis:snatch.enfasis, series:snatch.series, pct:cal.hBw, base:"halter"},
    {plano:"Halterofilia Potencia II: Clean+Press ⭐", nombre:clean.nombre, enfasis:clean.enfasis, series:clean.series, pct:0.75, base:"halter"},
    {plano:"Bíceps (Potencia I) - Braceo", nombre:curl.nombre, enfasis:curl.enfasis, series:curl.series, pct:0.70, base:"fixed"},
    {plano:"Bíceps (Potencia II - Alterno)", nombre:"Curl Mancuerna Alterno Explosivo", enfasis:"Asimetría braceo", series:cal.micro >= 6 ? "3 × 4-6 reps/brazo [EXPLOSIVO]" : "3 × 10 reps", pct:0.70, base:"fixed"},
    {plano:"Espalda (Potencia I - Remo) ⚡", nombre:remo.nombre, enfasis:remo.enfasis, series:remo.series, pct:0.75, base:"fixed"},
    {plano:"Espalda (Potencia II - Face Pull)", nombre:"Face Pull Explosivo", enfasis:"Velocidad máxima, estabilidad escapular", series:cal.micro >= 6 ? "3 × 8-10 [EXPLOSIVO]" : "4 × 12 reps", pct:0.70, base:"fixed"},
    {plano:"Deltoides (Potencia I - Press) ⚡", nombre:deltoides.nombre, enfasis:deltoides.enfasis, series:deltoides.series, pct:0.70, base:"fixed"},
    {plano:"Deltoides (Potencia II - Laterales)", nombre:"Elevaciones Laterales Explosivas", enfasis:"Velocidad máxima movilidad", series:cal.micro >= 6 ? "3 × 6-8 @ 65% [EXPLOSIVO]" : "4 × 12 reps", pct:0.65, base:"fixed"},
  ];
}

function TUESDAY(cal) {
  return [
    {plano:"Core Anti-Ext I", nombre:"Plancha Frontal Dinámica", enfasis:"Estabilidad máxima", series:"4 × 45-60 seg", pct:null, base:"fixed"},
    {plano:"Core Anti-Ext II", nombre:"Ab Wheel Rollout", enfasis:"Control excéntrico", series:"3 × 8-12 reps", pct:null, base:"fixed"},
    {plano:"Core Anti-Rot I", nombre:"Pallof Press", enfasis:"Estabilidad rotacional", series:"4 × 12 reps/lado", pct:null, base:"fixed"},
    {plano:"Core Anti-Rot II", nombre:"Russian Twist", enfasis:"Rotación controlada", series:"3 × 20 reps total", pct:null, base:"fixed"},
    {plano:"Sóleo I: Single-Leg Calf ⭐", nombre:selectSoleoVariant(cal.micro).nombre, enfasis:selectSoleoVariant(cal.micro).enfasis, series:selectSoleoVariant(cal.micro).series, pct:selectSoleoVariant(cal.micro).pct, base:"fixed"},
    {plano:"Sóleo II: Seated Calf ⭐", nombre:"Seated Calf Raises", enfasis:"Máxima carga, rango completo", series:cal.micro >= 6 ? "4 × 6-8 @ 75% [EXPLOSIVO]" : "3 × 12 reps", pct:0.75, base:"fixed"},
    {plano:"Prevención: Nordic Curls", nombre:"Nordic Hamstring Curls", enfasis:"Prevención isquios", series:"3 × 5-8 reps", pct:null, base:"fixed"},
    {plano:"Prevención: Copenhagen", nombre:"Copenhagen Plank", enfasis:"Estabilidad aductores", series:"3 × 30 seg/pierna", pct:null, base:"fixed"},
    {plano:"Estabilidad I", nombre:"Monster Walks", enfasis:"Movilidad cadera", series:"3 × 15 pasos c/lado", pct:null, base:"fixed"},
    {plano:"Estabilidad II", nombre:"Bird-Dog Cruzado", enfasis:"Control lumbar", series:"4 × 12 reps/lado", pct:null, base:"fixed"},
  ];
}

function WEDNESDAY(cal) {
  const curl = selectCurlVariant(cal.micro);
  const triceps = selectTricepsVariant(cal.micro);
  const remo = selectRemoVariant(cal.micro);
  const pectoral = selectPectoralVariant(cal.micro);
  const deltoides = selectDeltoidesVariant(cal.micro);
  
  return [
    {plano:"Bíceps (Potencia I - Braceo) ⚡", nombre:curl.nombre, enfasis:curl.enfasis + " [CICLO FLEXIÓN BRACEO]", series:curl.series, pct:curl.pct, base:"fixed"},
    {plano:"Bíceps (Potencia II - Alterno) ⚡", nombre:"Curl Mancuerna Alterno " + (cal.micro >= 6 ? "Explosivo" : ""), enfasis:"Asimetría alternancia (simula ciclo corrida)", series:cal.micro >= 6 ? "3 × 4-6 reps/brazo [EXPLOSIVO]" : "3 × 10 reps", pct:0.70, base:"fixed"},
    {plano:"Bíceps (Potencia III - Cable)", nombre:"Curl Cable Explosivo", enfasis:"Rango constante potencia", series:cal.micro >= 6 ? "3 × 6-8 [EXPLOSIVO]" : "3 × 10 reps", pct:0.70, base:"fixed"},
    
    {plano:"Tríceps (Potencia I - Extensión) ⚡", nombre:triceps.nombre, enfasis:triceps.enfasis + (cal.micro >= 6 ? " [EXTENSIÓN RÁPIDA SWING ATRÁS]" : ""), series:triceps.series, pct:triceps.pct, base:"fixed"},
    {plano:"Tríceps (Potencia II - Fondos) ⚡", nombre:"Fondos Paralelas " + (cal.micro >= 6 ? "Explosivos" : ""), enfasis:"Potencia máxima empuje", series:cal.micro >= 6 ? "3 × 4-6 + carga [EXPLOSIVO]" : "3 × 6-8 reps", pct:0.70, base:"fixed"},
    {plano:"Tríceps (Potencia III - Rope)", nombre:"Tricep Rope " + (cal.micro >= 6 ? "Explosivo" : ""), enfasis:"Velocidad máxima", series:cal.micro >= 6 ? "3 × 6-8 [EXPLOSIVO]" : "3 × 12 reps", pct:0.70, base:"fixed"},
    
    {plano:"Espalda (Potencia I - Remo) ⚡", nombre:remo.nombre, enfasis:remo.enfasis + (cal.micro >= 6 ? " [TRACCIÓN RÁPIDA SWING ATRÁS]" : ""), series:remo.series, pct:remo.pct, base:"fixed"},
    {plano:"Espalda (Potencia II - Face Pull) ⚡", nombre:"Face Pull con Liga " + (cal.micro >= 6 ? "Explosiva" : ""), enfasis:"Retracción rápida, estabilidad escapular", series:cal.micro >= 6 ? "3 × 8-10 [EXPLOSIVO]" : "4 × 12 reps", pct:0.70, base:"fixed"},
    {plano:"Espalda (Potencia III - Lat)", nombre:"Lat Pulldown " + (cal.micro >= 6 ? "Explosivo" : ""), enfasis:"Potencia tracción vertical", series:cal.micro >= 6 ? "3 × 4-5 [EXPLOSIVO]" : "3 × 8-10 reps", pct:0.70, base:"fixed"},
    
    {plano:"Pecho (Potencia I - Press) ⚡", nombre:pectoral.nombre, enfasis:pectoral.enfasis + (cal.micro >= 6 ? " [EMPUJE RÁPIDO SWING ADELANTE]" : ""), series:pectoral.series, pct:pectoral.pct, base:"bench"},
    {plano:"Pecho (Potencia II - Flexiones) ⚡", nombre:"Flexiones " + (cal.micro >= 6 ? "Explosivas + Carga" : "Controladas"), enfasis:"Control excéntrico + explosión", series:cal.micro >= 6 ? "3 × 4-6 [EXPLOSIVO]" : "3 × 8-10 reps", pct:0.70, base:"fixed"},
    {plano:"Pecho (Potencia III - Machine)", nombre:"Machine Chest Press " + (cal.micro >= 6 ? "Explosivo" : ""), enfasis:"Velocidad constante", series:cal.micro >= 6 ? "3 × 6-8 [EXPLOSIVO]" : "3 × 10-12 reps", pct:0.70, base:"fixed"},
    
    {plano:"Deltoides (Potencia I - Press) ⚡", nombre:deltoides.nombre, enfasis:deltoides.enfasis + (cal.micro >= 6 ? " [COORDINACIÓN INTEGRADA]" : ""), series:deltoides.series, pct:deltoides.pct, base:"fixed"},
    {plano:"Deltoides (Potencia II - Laterales) ⚡", nombre:"Elevaciones Laterales " + (cal.micro >= 6 ? "Explosivas" : ""), enfasis:"Velocidad máxima movilidad", series:cal.micro >= 6 ? "3 × 6-8 @ 65% [EXPLOSIVO]" : "4 × 12 reps", pct:0.65, base:"fixed"},
  ];
}

function THURSDAY(cal) {
  return [
    {plano:"Estabilidad Lateral I", nombre:"Plancha Lateral Dinámica", enfasis:"Control lateral máximo", series:"4 × 45 seg/lado", pct:null, base:"fixed"},
    {plano:"Estabilidad Lateral II", nombre:"Plancha Lateral + Abducción", enfasis:"Glúteo medio activación", series:"3 × 10 reps/lado", pct:null, base:"fixed"},
    {plano:"Core Anti-Ext", nombre:"Plancha Frontal Dinámica", enfasis:"Estabilidad máxima", series:"4 × 45-60 seg", pct:null, base:"fixed"},
    {plano:"Core Anti-Rot", nombre:"Pallof Press", enfasis:"Estabilidad rotacional", series:"3 × 12 reps/lado", pct:null, base:"fixed"},
    {plano:"Sóleo Potencia I: Jump Calf ⭐", nombre:selectJumpCalfVariant(cal.micro).nombre, enfasis:selectJumpCalfVariant(cal.micro).enfasis, series:selectJumpCalfVariant(cal.micro).series, pct:selectJumpCalfVariant(cal.micro).pct, base:"fixed"},
    {plano:"Sóleo Potencia II: Drop Walk ⭐", nombre:"Drop Walking", enfasis:cal.micro >= 6 ? "Excéntrico controlado 3-4s, TRABAJO ESPECÍFICO SPRINTERS" : "Técnica introductoria", series:cal.micro >= 6 ? "3 × 40-50 pasos [CRÍTICO]" : "2 × 20-30 pasos", pct:0.80, base:"fixed"},
    {plano:"Escapular I", nombre:"Plancha Alta Dinámica", enfasis:"Control escapular", series:"4 × 20 toques alternos", pct:null, base:"fixed"},
    {plano:"Escapular II", nombre:"Band Pull Aparts", enfasis:"Retracción escapular", series:"4 × 15 reps", pct:null, base:"fixed"},
    {plano:"Movilidad I", nombre:"Dislocaciones de Hombro", enfasis:"Amplitud movimiento", series:"3 × 12 reps", pct:null, base:"fixed"},
    {plano:"Coordinación", nombre:"Dead Bug Coordenado", enfasis:"Control respiratorio", series:"3 × 10 reps/lado", pct:null, base:"fixed"},
  ];
}

function FRIDAY(cal) {
  const squat = selectSquatVariant(cal.micro);
  const rdl = selectRDLVariant(cal.micro);
  const snatch = selectSnatchVariant(cal.micro);
  const clean = selectCleanVariant(cal.micro);
  const triceps = selectTricepsVariant(cal.micro);
  const pectoral = selectPectoralVariant(cal.micro);
  const deltoides = selectDeltoidesVariant(cal.micro);
  const cometti = selectComettiVariant(cal.micro);
  
  let ex = [
    {plano:"Cuádriceps (Potencia I)", nombre:squat.nombre, enfasis:squat.enfasis, series:squat.series, pct:cal.sqBw, base:"squat"},
    {plano:"Cuádriceps (Jump Squat)", nombre:"Jump Squat Explosivo", enfasis:"Máxima altura, potencia integrada", series:cal.micro >= 6 ? "3 × 3-4 [EXPLOSIVO]" : "3 × 4 reps", pct:0.70, base:"fixed"},
    {plano:"Femorales (Potencia I)", nombre:rdl.nombre, enfasis:rdl.enfasis, series:rdl.series, pct:cal.sqBw*0.70, base:"squat"},
    {plano:"Femorales (Good Morning)", nombre:"Good Morning Explosivo", enfasis:"Cadena posterior ciclo completo", series:cal.micro >= 6 ? "3 × 3-4 [EXPLOSIVO]" : "3 × 6 reps", pct:0.70, base:"squat"},
    {plano:"Halterofilia I: Snatch", nombre:snatch.nombre, enfasis:snatch.enfasis, series:snatch.series, pct:cal.hBw, base:"halter"},
    {plano:"Halterofilia II: Clean+Press", nombre:clean.nombre, enfasis:clean.enfasis, series:clean.series, pct:0.75, base:"halter"},
    {plano:"Halterofilia III: High Pull", nombre:"High Pull Explosivo", enfasis:"Aceleración máxima", series:cal.micro >= 6 ? "3 × 3-4 @ 70% [EXPLOSIVO]" : "3 × 4-6 reps", pct:0.70, base:"halter"},
    {plano:"Tríceps (Potencia I)", nombre:triceps.nombre, enfasis:triceps.enfasis, series:triceps.series, pct:triceps.pct, base:"fixed"},
    {plano:"Tríceps (Potencia II - Fondos)", nombre:"Fondos Paralelas Explosivos", enfasis:"Potencia máxima", series:cal.micro >= 6 ? "3 × 4-5 + carga [EXPLOSIVO]" : "3 × 6-8 reps", pct:0.70, base:"fixed"},
    {plano:"Pecho (Potencia I)", nombre:pectoral.nombre, enfasis:pectoral.enfasis, series:pectoral.series, pct:pectoral.pct, base:"bench"},
    {plano:"Pecho (Potencia II - Flexiones)", nombre:"Flexiones Explosivas", enfasis:"Control + explosión", series:cal.micro >= 6 ? "3 × 4-6 [EXPLOSIVO]" : "3 × 8-10 reps", pct:0.70, base:"fixed"},
    {plano:"Hombro (Potencia I)", nombre:deltoides.nombre, enfasis:deltoides.enfasis, series:deltoides.series, pct:deltoides.pct, base:"fixed"},
    {plano:"Hombro (Potencia II - Laterales)", nombre:"Elevaciones Laterales Explosivas", enfasis:"Velocidad máxima", series:cal.micro >= 6 ? "3 × 6-8 @ 65% [EXPLOSIVO]" : "4 × 12 reps", pct:0.65, base:"fixed"},
  ];
  
  // AGREGAR COMETTI FRANCÉS SOLO SI MICROS 6-10
  if(cal.micro >= 6 && cal.micro <= 10) {
    ex.push({
      plano:"⭐ COMETTI FRANCÉS (TRANSFERENCIA MÁXIMA) ⭐",
      nombre:cometti.nombre,
      enfasis:cometti.enfasis,
      estructura:cometti.estructura,
      series:cometti.series,
      pausa:cometti.pausa,
      rpe:cometti.rpe,
      objetivo:cometti.objetivo,
      isCometti:true
    });
  }
  
  return ex;
}

// ═══════════════════════════════════════════════════════════════════════════
// INTERFAZ Y RENDERIZACIÓN
// ═══════════════════════════════════════════════════════════════════════════

const DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
const DAY_FN = [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY];

let state = {
  micro: 6,
  athlete: ROSTER[0],
  halterKg: 80,
  squatKg: 140,
  benchKg: 90,
  halterReps: 3,
};

function render() {
  const cal = CALENDAR[state.micro - 1];
  const ath = state.athlete;
  
  let html = `
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">⚡</div>
        <div>
          <div class="brand-title">Panel de Fuerza ATR</div>
          <div class="brand-sub">Atletismo Nayarit — Velocistas 100m</div>
        </div>
      </div>
    </div>
    
    <div class="section-head">
      <div class="section-title">Microciclo Selector</div>
    </div>
    
    <div class="cal-info">
      <div class="cal-item">
        <div class="cal-label">Microciclo</div>
        <div class="cal-value">${state.micro}</div>
      </div>
      <div class="cal-item">
        <div class="cal-label">Fase</div>
        <div class="cal-value">${cal.fase}</div>
      </div>
      <div class="cal-item">
        <div class="cal-label">Énfasis</div>
        <div class="cal-value" style="font-size:13px;">${cal.title}</div>
      </div>
      <div class="cal-item">
        <div class="cal-label">Fechas</div>
        <div class="cal-value">${cal.fechas}</div>
      </div>
    </div>
    
    <div class="picker-row">
      <div class="field" style="flex:1;min-width:140px;">
        <label>Selecciona Microciclo</label>
        <select onchange="state.micro=parseInt(this.value); render();">
  `;
  
  for(let m = 1; m <= 12; m++) {
    html += `<option value="${m}" ${m === state.micro ? 'selected' : ''}>Micro ${m} — ${CALENDAR[m-1].title}</option>`;
  }
  
  html += `
        </select>
      </div>
      <div class="field" style="flex:1;min-width:100px;">
        <label>1RM Power Clean (kg)</label>
        <input type="number" value="${state.halterKg}" onchange="state.halterKg=parseInt(this.value); render();" />
      </div>
      <div class="field" style="flex:1;min-width:100px;">
        <label>1RM Squat (kg)</label>
        <input type="number" value="${state.squatKg}" onchange="state.squatKg=parseInt(this.value); render();" />
      </div>
      <div class="field" style="flex:1;min-width:100px;">
        <label>1RM Bench (kg)</label>
        <input type="number" value="${state.benchKg}" onchange="state.benchKg=parseInt(this.value); render();" />
      </div>
    </div>
    
    <div class="footer-note">
      <strong>Reestructura Micros 6-12:</strong> Énfasis en POTENCIA y TRANSFERENCIA directa a sprint 100m.
      Lunes: Potencia inferior + halterofilia (14-16 ejer) | Martes: Core + Sóleo (10 ejer) | 
      <strong>Miércoles: BRACEO DEL CORREDOR (12-13 ejer)</strong> | 
      Jueves: Estabilidad + Sóleo (12 ejer) | Viernes: Integración + Cometti (15 ejer).
      ⭐ Cometti Francés solo Micros 6-10.
    </div>
  `;
  
  // RENDERIZAR DÍAS
  for(let d = 0; d < 5; d++) {
    const ex = DAY_FN[d]({...cal, pctSquat: cal.sqBw, pctBench: cal.bnBw, pctHalter: cal.hBw, sqBw: cal.sqBw, bnBw: cal.bnBw, hBw: cal.hBw});
    
    html += `<div class="day-block">
      <div class="day-head">${DAYS[d]} (${ex.length} ejercicios)</div>
      <table>
        <thead>
          <tr><th>Ejercicio</th><th>Series</th><th>Carga</th><th>Notas</th></tr>
        </thead>
        <tbody>
    `;
    
    ex.forEach(e => {
      if(e.isCometti) {
        // COMETTI FRANCÉS - Bloque especial
        html += `
          <tr style="background:#3A2A1A;border:2px solid #E2B86A;">
            <td colspan="4">
              <div class="cometti-block">
                <div class="cometti-title">${e.nombre}</div>
                <div class="cometti-step"><strong>Estructura:</strong> ${e.estructura}</div>
                <div class="cometti-step"><strong>Series:</strong> ${e.series}</div>
                <div class="cometti-step"><strong>Descanso:</strong> ${e.pausa}</div>
                <div class="cometti-step"><strong>RPE:</strong> ${e.rpe}</div>
                <div class="cometti-step"><strong>Objetivo:</strong> ${e.objetivo}</div>
              </div>
            </td>
          </tr>
        `;
      } else {
        const carga = loadFor(e, state);
        html += `
          <tr>
            <td>
              <div class="ex-name">${e.nombre}</div>
              <div class="ex-plano">${e.plano}</div>
              ${e.enfasis ? `<div class="ex-enfasis">${e.enfasis}</div>` : ''}
            </td>
            <td>${e.series || '—'}</td>
            <td>
              ${e.pct ? `<span class="load-pill">${Math.round(e.pct*100)}%</span>` : ''}
              ${e.base && carga !== '—' ? ` <span class="load-pill">${carga} kg</span>` : ''}
            </td>
            <td style="font-size:10px;color:var(--muted);">${e.pausa ? `Desc: ${e.pausa}` : '—'}</td>
          </tr>
        `;
      }
    });
    
    html += `
        </tbody>
      </table>
    </div>
    `;
  }
  
  html += `</div>`;
  document.getElementById('root').innerHTML = html;
}

// INICIAL
render();
</script>
</body>
</html>
