<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel de Fuerza ATR — Atletismo Nayarit</title>
<style>
  :root{
    --bg:#0A0D12; --surface:#12161D; --surface2:#1A2029; --surface3:#212836;
    --line:#2A3140; --text:#EDEFF3; --muted:#8B94A3; --muted2:#5C6472;
    --lane:#E2452C; --acum:#3B82F6; --trans:#E2452C; --real:#F2B705; --ok:#37C77F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
  #root{min-height:100vh;}
  .mono{font-family:'Courier New',Courier,monospace;}
  .display{font-family:'Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
  .app{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:38px;height:38px;border-radius:50%;background:conic-gradient(from 180deg, var(--lane), #7A1E12, var(--lane));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .brand-title{font-weight:700;font-size:19px;letter-spacing:0.02em;text-transform:uppercase;}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
  .tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap;}
  .tab{padding:9px 14px;border-radius:7px;font-size:12px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:transparent;}
  .tab.active{background:var(--lane);color:#fff;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px;flex-wrap:wrap;gap:8px;}
  .section-title{font-weight:700;font-size:15px;letter-spacing:0.03em;text-transform:uppercase;}
  .section-note{font-size:12px;color:var(--muted);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;}
  .lane-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;cursor:pointer;}
  .lane-stripe{position:absolute;left:0;top:0;bottom:0;width:5px;}
  .lane-row{display:flex;align-items:center;gap:11px;}
  .bib{width:34px;height:34px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;font-weight:700;font-size:13px;flex-shrink:0;}
  .lane-name{font-weight:700;font-size:14.5px;}
  .lane-event{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .lane-meta{display:flex;justify-content:space-between;margin-top:12px;font-size:11px;align-items:center;}
  .phase-tag{font-size:10.5px;letter-spacing:0.03em;text-transform:uppercase;padding:3px 8px;border-radius:5px;font-weight:700;}
  .rm-row{display:flex;gap:14px;margin-top:10px;font-size:12px;}
  .rm-item{color:var(--muted);}
  .rm-item b{color:var(--text);font-family:'Courier New',monospace;}
  .del-btn{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--surface3);color:var(--muted);border:none;cursor:pointer;font-size:13px;line-height:1;}
  .del-btn:hover{background:#7A1E12;color:#fff;}
  .today-hero{background:linear-gradient(135deg, var(--surface2), var(--surface));border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:20px;}
  .today-date{font-family:'Courier New',monospace;font-size:12px;color:var(--muted);letter-spacing:0.03em;}
  .today-day{font-weight:700;font-size:26px;text-transform:uppercase;margin:4px 0 2px;}
  .today-phase{display:inline-block;margin-top:8px;}
  .picker-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;justify-content:space-between;}
  select{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;}
  .day-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;}
  .day-head{background:var(--surface2);padding:12px 16px;font-weight:700;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;padding:8px 12px;border-bottom:1px solid var(--line);}
  td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .ex-name{font-weight:700;}
  .ex-plano{font-size:10.5px;color:var(--muted);}
  .ex-enfasis{font-size:9px;color:var(--accent);font-style:italic;margin-top:2px;}
  .load-pill{font-family:'Courier New',monospace;font-weight:700;background:var(--surface3);padding:3px 8px;border-radius:6px;display:inline-block;white-space:nowrap;}
  .rest-msg,.empty-msg{text-align:center;padding:40px 20px;color:var(--muted);}
  .selector-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px;}
  .selector-bar label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;display:block;margin-bottom:4px;}
  .micro-strip{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .micro-dot{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);}
  .micro-dot.active{color:#fff;}
  .cal-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
  .cal-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
  .cal-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;}
  .cal-value{font-family:'Courier New',monospace;font-size:14px;font-weight:700;margin-top:3px;}
  .footer-note{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted2);line-height:1.6;}
  .rm-form,.athlete-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;}
  input[type=number],input[type=date],input[type=text]{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:'Courier New',monospace;font-size:13px;width:110px;}
  input[type=text].wide{width:170px;font-family:inherit;}
  .btn{background:var(--lane);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;cursor:pointer;}
  .btn.secondary{background:var(--surface3);color:var(--text);}
  .btn.big{padding:12px 22px;font-size:13px;}
  .chart-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px;}
  .rpe-input{width:60px;}
  .log-cell{display:flex;gap:6px;align-items:center;}
  .log-list{display:flex;flex-direction:column;gap:8px;}
  .log-entry{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;}
  .save-bar{display:flex;justify-content:flex-end;padding:12px 16px;background:var(--surface2);}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06210F;padding:10px 18px;border-radius:8px;font-size:12.5px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.4);}

  .vel-pill{display:inline-block;font-family:'Courier New',monospace;font-weight:700;font-size:11px;padding:3px 8px;border-radius:6px;margin-top:4px;}
  .tempo-note{font-size:11px;color:var(--muted);line-height:1.4;}
  .vel-legend{display:flex;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:11px;}
  .vel-legend-item{display:flex;align-items:center;gap:6px;color:var(--muted);}
  .vel-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

  @media (max-width:640px){
    .brand-title{font-size:16px;} .today-day{font-size:20px;}
    .day-head{font-size:11.5px; line-height:1.4; padding:10px 12px;}
    .app{padding:14px 10px 50px;}
    input[type=number],input[type=date],input[type=text]{width:90px;}
    table{border:none;}
    thead{display:none;}
    table, tbody, tr, td{display:block; width:100%;}
    tr{background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; padding:10px 12px;}
    td{border-bottom:1px solid var(--line); padding:8px 0; display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
    td:last-child{border-bottom:none;}
    td::before{content:attr(data-label); color:var(--muted); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; flex-shrink:0; padding-top:2px;}
    td:first-child{flex-direction:column; align-items:flex-start; gap:2px;}
    td:first-child::before{display:none;}
    .ex-name{font-size:14px;}
    .log-cell{justify-content:flex-end;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

const epley = (kg,reps)=> Math.round(kg*(1+0.0333*reps)*10)/10;
const todayISO = ()=> new Date().toISOString().slice(0,10);
const fmtDate = (iso)=>{ const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const esc = (s)=> String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CALENDAR = [
  {micro:1, fase:"Acumulación", faseCode:"A", start:"2026-09-07", end:"2026-09-13", tipo:"Adaptación Anatómica / Base", pctSquat:0.65, pctBench:0.65, pctHalter:0.60, perdidaVel:"10% - 12%", volumen:"Alto (400 reps)", enfoque:"Preparación articular, tendinosa y puesta a tono neuromuscular"},
  {micro:2, fase:"Acumulación", faseCode:"A", start:"2026-09-14", end:"2026-09-20", tipo:"Hipertrofia-Fuerza", pctSquat:0.72, pctBench:0.72, pctHalter:0.65, perdidaVel:"12% - 15%", volumen:"Muy Alto (480 reps)", enfoque:"Ganancia de volumen muscular y base de fuerza para transferencia neural"},
  {micro:3, fase:"Acumulación", faseCode:"A", start:"2026-09-21", end:"2026-09-27", tipo:"Fuerza Máxima I", pctSquat:0.80, pctBench:0.80, pctHalter:0.70, perdidaVel:"15% - 18%", volumen:"Medio-Alto (360 reps)", enfoque:"Reclutamiento de FT IIx/IIb · Primeros picos de activación neural"},
  {micro:4, fase:"Acumulación", faseCode:"A", start:"2026-09-28", end:"2026-10-04", tipo:"Fuerza Máxima II", pctSquat:0.85, pctBench:0.85, pctHalter:0.75, perdidaVel:"15% - 20%", volumen:"Medio (320 reps)", enfoque:"Consolidación de reclutamiento · Clusters 3×3 y parejas de impacto"},
  {micro:5, fase:"Acumulación", faseCode:"A", start:"2026-10-05", end:"2026-10-11", tipo:"Recuperación / Consolidación", pctSquat:0.70, pctBench:0.70, pctHalter:0.65, perdidaVel:"< 10%", volumen:"Bajo (280 reps)", enfoque:"Supercompensación neural y recuperación articular antes del pico final"},
  {micro:6, fase:"Acumulación", faseCode:"A", start:"2026-10-12", end:"2026-10-18", tipo:"Fuerza Máxima III / Pico Acumulación", pctSquat:0.90, pctBench:0.88, pctHalter:0.80, perdidaVel:"18% - 22%", volumen:"Muy Bajo (240 reps)", enfoque:"Pico máximo de Acumulación · Máxima densidad neural · Transición a Transformación"},
  {micro:7, fase:"Transformación", faseCode:"T", start:"2026-10-19", end:"2026-10-25", tipo:"Carga / Potencia I", pctSquat:0.70, pctBench:0.65, pctHalter:0.75, perdidaVel:"< 10-12%", volumen:"Medio (320 reps)", enfoque:"Fuerza rápida, RFD y arrancada colgante"},
  {micro:8, fase:"Transformación", faseCode:"T", start:"2026-10-26", end:"2026-11-01", tipo:"Impacto / PAP 85%", pctSquat:0.85, pctBench:0.80, pctHalter:0.82, perdidaVel:"< 10%", volumen:"Medio-Alto (340 reps)", enfoque:"Pico de contraste pesado y Método Francés (Cometti)"},
  {micro:9, fase:"Transformación", faseCode:"T", start:"2026-11-02", end:"2026-11-08", tipo:"Carga / Halterofilia", pctSquat:0.75, pctBench:0.70, pctHalter:0.80, perdidaVel:"< 10%", volumen:"Medio (320 reps)", enfoque:"Derivados de halterofilia y triple extensión explosiva"},
  {micro:10, fase:"Transformación", faseCode:"T", start:"2026-11-09", end:"2026-11-15", tipo:"Específico / RFD", pctSquat:0.65, pctBench:0.65, pctHalter:0.70, perdidaVel:"< 8-10%", volumen:"Medio-Bajo (280 reps)", enfoque:"Tasa de desarrollo de fuerza y velocidad horizontal"},
  {micro:11, fase:"Realización", faseCode:"R", start:"2026-11-16", end:"2026-11-22", tipo:"Puesta a Punto", pctSquat:0.50, pctBench:0.50, pctHalter:0.55, perdidaVel:"< 5%", volumen:"Muy Bajo (180 reps)", enfoque:"Potenciación neural y stiffness de tobillo sin fatiga"},
  {micro:12, fase:"Realización", faseCode:"R", start:"2026-11-23", end:"2026-11-29", tipo:"Competición / Descarga Final", pctSquat:0.40, pctBench:0.40, pctHalter:0.45, perdidaVel:"< 5%", volumen:"Mínimo (120 reps)", enfoque:"Tapering final, máxima frescura y velocidad pura"},
];
const PHASE_COLOR = {A:"var(--acum)", T:"var(--trans)", R:"var(--real)"};
const PHASE_LABEL = {A:"Acumulación", T:"Transformación", R:"Realización"};
const DAY_LABEL = {
  monday:"Lunes — Fuerza Máxima / Potencia Base (Inferior y Superior)", 
  tuesday:"Martes — Core Avanzado, Estabilidad Lumbopélvica y Prevención", 
  wednesday:"Miércoles — Tracción, Cadena Posterior y Halterofilia", 
  thursday:"Jueves — Core Dinámico, Rotacional y Anti-movimiento", 
  friday:"Viernes — Específico & Contraste Francés (Cometti)"
};

// SELECTOR DE VARIANTES POR MICROCICLO
const selectSquatVariant = (micro) => {
  if(micro <= 2) return {nombre:"Sentadilla Trasera Profunda en Rack", enfasis:"Adaptación, rango completo"};
  if(micro <= 4) return {nombre:"Media Sentadilla 90° Pesada", enfasis:"Ángulo específico salida tacos"};
  if(micro === 5) return {nombre:"Sentadilla Frontal", enfasis:"Recuperación, técnica sin fatiga"};
  if(micro <= 10) return {nombre:"Sentadilla Explosiva (Reducida)", enfasis:"Potencia, máxima velocidad"};
  return {nombre:"Sentadilla Muy Ligera", enfasis:"Mantenimiento, activación neural"};
};

const selectHipThrustVariant = (micro) => {
  if(micro <= 2) return {nombre:"Hip Thrust con Barra en Banco", enfasis:"Adaptación, vector horizontal"};
  if(micro <= 4) return {nombre:"Hip Thrust Pesado con Barra", enfasis:"Extensión cadera máxima"};
  if(micro === 5) return {nombre:"Hip Thrust Moderado", enfasis:"Recuperación, sin fatiga"};
  if(micro <= 10) return {nombre:"Hip Thrust Explosivo", enfasis:"PAP extensión cadera, velocidad"};
  return {nombre:"Hip Thrust Ligero", enfasis:"Activación cadera"};
};

const selectRDLVariant = (micro) => {
  if(micro <= 2) return {nombre:"Peso Muerto Rumano Clásico con Barra", enfasis:"Adaptación, control excéntrico"};
  if(micro <= 4) return {nombre:"RDL Pesado", enfasis:"Fuerza máxima isquios"};
  if(micro === 5) return {nombre:"Peso Muerto Sumo (Variante)", enfasis:"Recuperación, amplitud cadera"};
  if(micro <= 10) return {nombre:"RDL Dinámico Unilateral", enfasis:"Potencia isquios"};
  return {nombre:"RDL Muy Ligero", enfasis:"Movilidad dinámica"};
};

const selectBancaVariant = (micro) => {
  if(micro <= 2) return {nombre:"Press de Banca Plano en Banco", enfasis:"Adaptación, pausa 1s"};
  if(micro <= 4) return {nombre:"Press de Banca Pesado", enfasis:"Fuerza máxima, pausa 2s"};
  if(micro === 5) return {nombre:"Press de Banca Moderado", enfasis:"Recuperación, velocidad natural"};
  if(micro <= 10) return {nombre:"Press de Banca Explosivo", enfasis:"Potencia tren superior"};
  return {nombre:"Press de Banca Muy Ligero", enfasis:"Activación, sin fatiga"};
};

const selectInclinedVariant = (micro) => {
  if(micro <= 2) return {nombre:"Press Inclinado con Mancuernas", enfasis:"Adaptación", pct:0.70};
  if(micro <= 4) return {nombre:"Press Inclinado Pesado", enfasis:"Pectoral-deltoides", pct:0.75};
  if(micro === 5) return {nombre:"Press Inclinado Ligero", enfasis:"Recuperación", pct:0.60};
  return {nombre:"Press Inclinado Dinámico", enfasis:"Potencia deltoides", pct:0.70};
};

const selectDominadasVariant = (micro) => {
  if(micro <= 2) return {nombre:"Dominadas Asistidas con Banda", enfasis:"Adaptación", lastre:"BW - banda"};
  if(micro <= 4) return {nombre:"Dominadas Ponderadas", enfasis:"Fuerza máxima tracción", lastre:"+25 kg"};
  if(micro === 5) return {nombre:"Dominadas Asistidas Moderadas", enfasis:"Recuperación", lastre:"BW - 10 kg"};
  if(micro <= 10) return {nombre:"Dominadas Explosivas", enfasis:"Potencia tracción", lastre:"BW o +10 kg"};
  return {nombre:"Dominadas Asistidas Ligeras", enfasis:"Activación", lastre:"BW - 20 kg"};
};

const selectPressMilitarVariant = (micro) => {
  if(micro <= 2) return {nombre:"Press Militar Sentado con Barra", enfasis:"Adaptación, 60-70%"};
  if(micro <= 4) return {nombre:"Press Militar de Pie Pesado", enfasis:"Fuerza máxima, 80-85%"};
  if(micro === 5) return {nombre:"Press Militar Sentado Moderado", enfasis:"Recuperación, 65%"};
  if(micro <= 10) return {nombre:"Push Press / Empuje de Fuerza", enfasis:"Potencia hombro, 75-80%"};
  return {nombre:"Press Militar Muy Ligero", enfasis:"Activación, 50%"};
};

const selectPectoralVariant = (micro) => {
  if(micro <= 2) return {nombre:"Flexión con Pecho en Banco Bajo", enfasis:"Adaptación vector horizontal", pct:0.65};
  if(micro <= 4) return {nombre:"Press Pecho Horizontal Pesado", enfasis:"Máxima fuerza pectoral", pct:0.80};
  if(micro === 5) return {nombre:"Press Pecho Moderado", enfasis:"Recuperación", pct:0.65};
  if(micro <= 10) return {nombre:"Flexión Explosiva / Pecho Dinámico", enfasis:"Potencia tren superior", pct:0.70};
  return {nombre:"Press Pecho Muy Ligero", enfasis:"Activación sin fatiga", pct:0.55};
};

const selectTricepsVariant = (micro) => {
  if(micro <= 2) return {nombre:"Extensión Tríceps Cuerda en Polea", enfasis:"Adaptación, rango completo"};
  if(micro <= 4) return {nombre:"Fondos Pesados en Banco + Lastre", enfasis:"Fuerza máxima cierre"};
  if(micro === 5) return {nombre:"Press Francés Moderado", enfasis:"Recuperación"};
  if(micro <= 10) return {nombre:"Extensión Explosiva Tríceps", enfasis:"Potencia extensión"};
  return {nombre:"Extensión Tríceps Ligera", enfasis:"Activación neural"};
};

const selectTraccionVariant = (micro) => {
  if(micro <= 2) return {nombre:"Remo con Liga (Adaptación) - Banda Ligera", enfasis:"Rango completo, control técnico"};
  if(micro <= 4) return {nombre:"Remo Inclinado con Liga Fuerte", enfasis:"Fuerza máxima espalda"};
  if(micro === 5) return {nombre:"Remo Moderado Unilateral con Liga Media", enfasis:"Recuperación"};
  if(micro <= 10) return {nombre:"Remo Explosivo con Liga Fuerte", enfasis:"Potencia espalda, velocidad"};
  return {nombre:"Remo Ligero con Liga Ligera", enfasis:"Activación neural"};
};

const selectCoreAntiExt = (micro) => {
  if(micro <= 2) return {nombre:"Plancha Abdominal Frontal 45 seg", enfasis:"Base isométrica"};
  if(micro <= 4) return {nombre:"Ab Wheel Rollout Pesado", enfasis:"Fuerza anti-extensión"};
  if(micro === 5) return {nombre:"Plancha Moderada en Balón Suizo", enfasis:"Recuperación con inestabilidad"};
  if(micro <= 10) return {nombre:"Ab Wheel Explosivo", enfasis:"Potencia anti-extensión"};
  return {nombre:"Plancha Ligera", enfasis:"Activación neural"};
};

const selectCoreAntiRot = (micro) => {
  if(micro <= 2) return {nombre:"Pallof Press Moderado", enfasis:"Estabilidad rotacional base"};
  if(micro <= 4) return {nombre:"Pallof Press Pesado Unilateral", enfasis:"Fuerza máxima anti-rotación"};
  if(micro === 5) return {nombre:"Pallof Press Ligero", enfasis:"Recuperación"};
  if(micro <= 10) return {nombre:"Pallof Press Explosivo", enfasis:"Potencia rotacional"};
  return {nombre:"Pallof Press Muy Ligero", enfasis:"Activación"};
};

const selectSnatchVariant = (micro) => {
  if(micro <= 2) return {nombre:"Hang Power Snatch Técnico", enfasis:"Aprendizaje, 50-60%", series:"3 × 4 [Técnica]"};
  if(micro <= 4) return {nombre:"Snatch Pull Pesado", enfasis:"Halterofilia fuerza, 90-95%", series:"4 × 3"};
  if(micro === 5) return {nombre:"Hang Power Snatch Ligero", enfasis:"Técnica sin fatiga, 60%", series:"3 × 4"};

function velocityZone(pct){
  if(pct==null) return null;
  const table = [
    {p:0.40,v:1.00},{p:0.50,v:0.85},{p:0.55,v:0.78},{p:0.60,v:0.70},
    {p:0.65,v:0.63},{p:0.70,v:0.55},{p:0.75,v:0.48},{p:0.80,v:0.40},
    {p:0.85,v:0.32},{p:0.90,v:0.25},
  ];
  const c = Math.min(Math.max(pct,0.40),0.90);
  let v = table[table.length-1].v;
  for(let i=0;i<table.length-1;i++){
    if(c>=table[i].p && c<=table[i+1].p){
      const t=(c-table[i].p)/(table[i+1].p-table[i].p);
      v = table[i].v + t*(table[i+1].v-table[i].v);
      break;
    }
  }
  const vMin = Math.round((v-0.05)*100)/100;
  const vMax = Math.round((v+0.05)*100)/100;
  let zone, color;
  if(v>=0.85){zone="Velocidad-Potencia"; color="#22C55E";}
  else if(v>=0.65){zone="Fuerza-Velocidad"; color="#3B82F6";}
  else if(v>=0.45){zone="Fuerza-Potencia"; color="#F2B705";}
  else {zone="Fuerza Máxima"; color="#E2452C";}
  return {vMin, vMax, zone, color};
}

  {zone:"Fuerza-Velocidad", color:"#3B82F6", range:"0.65 – 0.85 m/s"},
  {zone:"Velocidad-Potencia", color:"#22C55E", range:"> 0.85 m/s"},
];

function tempoFor(ex){
  const n = ex.nombre.toLowerCase();
  if(n.includes("plank") || n.includes("isometr") || n.includes("vacuum")) return "Tensión constante (isometría), sin componente de velocidad";
  if(n.includes("monster walk") || n.includes("face pull") || n.includes("pallof") || n.includes("elevaciones") || n.includes("curl")) return "Tempo 2-0-2-0 controlado";
  if(ex.base==="fixed" && ex.pct==null) return "Técnica controlada y fluida, enfoque en control postural";
  if(n.includes("arrancada") || n.includes("cargada") || n.includes("contraste") || n.includes("push press") || n.includes("high pull") || n.includes("lanzamientos")) return "Máxima velocidad intencional (fase concéntrica explosiva)";
  if(ex.base==="squat" || ex.base==="bench"){
    if(ex.pct!=null && ex.pct>=0.80) return "Excéntrico controlado (2-3s), concéntrico explosivo";
    return "Concéntrico intencionalmente rápido, excéntrico controlado";
  }
  return "Ejecución técnica controlada";
}
function velocityCellHTML(ex){
  const tempo = tempoFor(ex);
  let velHTML = "";
  if(ex.base!=="fixed" && ex.pct!=null){
    const z = velocityZone(ex.pct);
    velHTML = `<div class="vel-pill" style="background:${z.color}22;color:${z.color}">${z.vMin}–${z.vMax} m/s · ${z.zone}</div>`;
  }
  return `<div class="tempo-note">${tempo}</div>${velHTML}`;
}
const currentMicroFromDate = (d)=>{
  const iso = d.toISOString().slice(0,10);
  const found = CALENDAR.find(c=> iso>=c.start && iso<=c.end);
  if(found) return {micro:found.micro, status:"activo"};
  if(iso < CALENDAR[0].start) return {micro:1, status:"pretemporada"};
  return {micro:12, status:"finalizado"};
};

};

const hasStorage = ()=> typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
async function stGet(key){
  if(!hasStorage()) return null;
  try{ const r = await window.storage.get(key); return r ? r.value : null; }catch(e){ return null; }
}
async function stSet(key,val){
  if(!hasStorage()) return false;
  try{ await window.storage.set(key,val); return true; }catch(e){ return false; }
}

async function initState(){

  if(raw){

    }catch(e){}

  if(State.athletes.length) State.selectedAthleteId = State.athletes[0].id;
  render();

async function persistRoster(){
  await stSet("athletes-roster", JSON.stringify({athletes:State.athletes, nextId:State.nextId}));

async function addAthlete(fields){
  const a = {
    id: State.nextId++,

    sex: fields.sex,
    event: fields.event.trim(),
    bw: Number(fields.bw)||null,

    squatReps: Number(fields.squatReps)||1,
    benchKg: Number(fields.benchKg)||0,
    benchReps: Number(fields.benchReps)||1,

async function deleteAthlete(id, evt){
  if(evt) evt.stopPropagation();

  State.athletes = State.athletes.filter(a=>a.id!==id);
  await persistRoster();
  if(State.selectedAthleteId===id) State.selectedAthleteId = State.athletes[0] ? State.athletes[0].id : null;
  render();
}

async function getCoachPin(){ return await stGet("coach-pin"); }
async function ensurePinAndConfirm(actionLabel){
  const pin = await getCoachPin();
  if(!pin){
    const newPin = prompt(`Aún no hay PIN de entrenador configurado.\nCrea un PIN (4 a 6 dígitos) para proteger las eliminaciones de aquí en adelante:`);
    if(!newPin) return false;
    if(!/^\d{4,6}$/.test(newPin)){ alert("El PIN debe tener entre 4 y 6 dígitos numéricos."); return false; }
    await stSet("coach-pin", newPin);
    showToast("PIN de entrenador configurado");
    return true;
  }
  const entered = prompt(`Ingresa el PIN de entrenador para ${actionLabel}:`);
  if(entered===null) return false;
  if(entered!==pin){ alert("PIN incorrecto. No se realizó la acción."); return false; }
  return true;
}
async function changePin(){
  const pin = await getCoachPin();
  if(pin){
    const entered = prompt("Ingresa el PIN actual del entrenador:");
    if(entered===null) return;
    if(entered!==pin){ alert("PIN incorrecto."); return; }
  }
  const newPin = prompt("Nuevo PIN (4 a 6 dígitos):");
  if(!newPin) return;
  if(!/^\d{4,6}$/.test(newPin)){ alert("El PIN debe tener entre 4 y 6 dígitos numéricos."); return; }
  await stSet("coach-pin", newPin);
  showToast("PIN actualizado");
}

async function guardarSesion(exercises, athleteId, day, micro){
  const entries = exercises.map(ex=>({
    nombre: ex.nombre,
    completado: (State.logDraft[ex.nombre]&&State.logDraft[ex.nombre].completado)||"",
    rpe: (State.logDraft[ex.nombre]&&State.logDraft[ex.nombre].rpe)||"",
  }));
  const log = {athleteId, date: todayISO(), day, micro, entries};
  await stSet(`session-log:${athleteId}:${todayISO()}`, JSON.stringify(log));
  const idxRaw = await stGet(`log-index:${athleteId}`);
  let idx = [];
  try{ idx = idxRaw?JSON.parse(idxRaw):[]; }catch(e){}
  if(!idx.includes(todayISO())){ idx.push(todayISO()); await stSet(`log-index:${athleteId}`, JSON.stringify(idx)); }
  showToast("Sesión registrada");
  render();
}

async function loadHistorialFor(athleteId){
  if(State.historial[athleteId]) return State.historial[athleteId];
  const raw = await stGet(`rm-history:${athleteId}`);
  let hist = [];
  try{ hist = raw?JSON.parse(raw):[]; }catch(e){}
  if(!hist.length){
    const a = State.athletes.find(x=>x.id===athleteId);
    if(a) hist = [{date:todayISO(), squatKg:a.squatKg, squatReps:a.squatReps, benchKg:a.benchKg, benchReps:a.benchReps, halterKg:a.halterKg||0, halterReps:a.halterReps||0}];
  }
  State.historial[athleteId] = hist;
  return hist;
}
async function loadLogsFor(athleteId){
  const idxRaw = await stGet(`log-index:${athleteId}`);
  let idx = [];
  try{ idx = idxRaw?JSON.parse(idxRaw):[]; }catch(e){}
  const sorted = [...idx].sort().reverse().slice(0,6);
  const entries = [];
  for(const d of sorted){
    const raw = await stGet(`session-log:${athleteId}:${d}`);
    if(raw){ try{ entries.push(JSON.parse(raw)); }catch(e){} }
  }
  State.logsCache[athleteId] = entries;
  return entries;
}
async function addRMEntry(athleteId, entry){
  const hist = await loadHistorialFor(athleteId);
  const updated = [...hist, entry].sort((a,b)=>a.date.localeCompare(b.date));
  State.historial[athleteId] = updated;
  await stSet(`rm-history:${athleteId}`, JSON.stringify(updated));
  showToast("Test guardado");
  render();
}

async function exportBackup(){
  const data = {version:1, exportedAt:new Date().toISOString(), athletes:State.athletes, nextId:State.nextId, historial:{}, logs:{}};
  for(const a of State.athletes){
    data.historial[a.id] = await loadHistorialFor(a.id);
    const idxRaw = await stGet(`log-index:${a.id}`);
    let idx=[]; try{ idx = idxRaw?JSON.parse(idxRaw):[]; }catch(e){}
    data.logs[a.id] = {};
    for(const d of idx){
      const raw = await stGet(`session-log:${a.id}:${d}`);
      if(raw){ try{ data.logs[a.id][d] = JSON.parse(raw); }catch(e){} }
    }
  }
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url; link.download = `respaldo_fuerza_atr_${todayISO()}.json`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
  showToast("Respaldo descargado");
}
function triggerImport(){ document.getElementById("import-file").click(); }
async function handleImportFile(input){
  const file = input.files[0];
  if(!file) return;
  const authorized = await ensurePinAndConfirm("restaurar un respaldo (reemplaza el roster actual)");
  if(!authorized){ input.value=""; return; }
  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ alert("Archivo inválido."); input.value=""; return; }
  if(!confirm("Esto reemplazará el roster y el historial actuales con los del respaldo. ¿Continuar?")){ input.value=""; return; }
  State.athletes = data.athletes || [];
  State.nextId = data.nextId || (State.athletes.length+1);
  await persistRoster();
  State.historial = {}; State.logsCache = {};
  for(const idStr of Object.keys(data.historial||{})){
    State.historial[idStr] = data.historial[idStr];
    await stSet(`rm-history:${idStr}`, JSON.stringify(data.historial[idStr]));
  }
  for(const idStr of Object.keys(data.logs||{})){
    const days = Object.keys(data.logs[idStr]);
    await stSet(`log-index:${idStr}`, JSON.stringify(days));
    for(const d of days){
      await stSet(`session-log:${idStr}:${d}`, JSON.stringify(data.logs[idStr][d]));
    }
  }
  input.value = "";
  showToast("Respaldo restaurado");
  render();
}

function miniChartSVG(points, color){
  if(points.length<2) return `<div style="font-size:11.5px;color:var(--muted)">Se necesitan al menos 2 registros para graficar.</div>`;
  const W=560,H=140,pad=28;
  const ys = points.map(p=>p.y);
  const minY = Math.min(...ys)*0.95, maxY = Math.max(...ys)*1.05;
  const xI = i => pad + (i/(points.length-1))*(W-2*pad);
  const yV = v => H-pad - ((v-minY)/((maxY-minY)||1))*(H-2*pad);
  const path = points.map((p,i)=>`${i===0?"M":"L"} ${xI(i)} ${yV(p.y)}`).join(" ");
  const circles = points.map((p,i)=>`<circle cx="${xI(i)}" cy="${yV(p.y)}" r="3.5" fill="${color}"/>`).join("");
  const labels = points.map((p,i)=>`<text x="${xI(i)}" y="${H-8}" font-size="9" fill="var(--muted)" text-anchor="middle" font-family="Courier New">${p.dateLabel}</text>`).join("");
  const last = points[points.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${circles}${labels}
    <text x="${xI(points.length-1)}" y="${yV(last.y)-10}" font-size="11" fill="${color}" text-anchor="end" font-family="Courier New" font-weight="700">${last.y} kg</text>
  </svg>`;
}

}

function renderHoy(){
  if(State.athletes.length===0) return `<div class="day-block"><div class="empty-msg">Registra al menos un atleta en <b>Panel de Equipo</b> para usar esta sección.<br/><br/><button class="btn big" onclick="setTab('panel')">Ir a Panel de Equipo</button></div></div>`;
  if(!State.selectedAthleteId) State.selectedAthleteId = State.athletes[0].id;
  const athlete = State.athletes.find(a=>a.id===State.selectedAthleteId);
  const today = new Date();
  const weekday = today.getDay();
  const trainingDay = trainingDayFromWeekday(weekday);
  const autoMicro = currentMicroFromDate(today);
  const cal = CALENDAR.find(c=>c.micro===autoMicro.micro);
  const color = PHASE_COLOR[cal.faseCode];
  
  let exercises = null;
  if(trainingDay==="monday") exercises = MONDAY(cal);
  else if(trainingDay==="tuesday") exercises = TUESDAY(cal);
  else if(trainingDay==="wednesday") exercises = WEDNESDAY(cal);
  else if(trainingDay==="thursday") exercises = THURSDAY(cal);
  else if(trainingDay==="friday") exercises = FRIDAY(cal);

  const dateStr = today.toLocaleDateString('es-MX', {weekday:'long', day:'numeric', month:'long'});
  const statusMsg = autoMicro.status==="pretemporada" ? `Pretemporada — el macrociclo inicia el ${fmtDate(CALENDAR[0].start)}`
    : autoMicro.status==="finalizado" ? "Macrociclo finalizado — última fase mostrada como referencia"
    : `Micro ${autoMicro.micro} en curso`;

  const tableAndSave = exercises ? `
    <div class="day-block">
      <div class="day-head"><span>${DAY_LABEL[trainingDay]}</span><span class="mono" style="font-weight:400;color:var(--muted);font-size:11px">${esc(athlete.name)}</span></div>
      ${exerciseTableHTML(exercises, athlete, State.logMode)}
      ${State.logMode ? `<div class="save-bar"><button class="btn" onclick='guardarSesion(${JSON.stringify(exercises).replace(/'/g,"&#39;")}, ${athlete.id}, "${trainingDay}", ${cal.micro})'>Guardar sesión</button></div>` : ""}
    </div>` : `<div class="day-block"><div class="rest-msg">Hoy no corresponde sesión programada en el ciclo Lun–Vie.<br/>Usa el Selector de Microciclo para revisar cualquier día de la semana.</div></div>`;

  return `
    <div class="today-hero">
      <div class="today-date mono">${dateStr.toUpperCase()}</div>
      <div class="today-day">${trainingDay?DAY_LABEL[trainingDay].split("—")[0]:"Día de descanso / fin de semana"}</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px">${statusMsg}</div>
      <div class="today-phase"><span class="phase-tag" style="background:${color}22;color:${color}">Micro ${cal.micro} · ${PHASE_LABEL[cal.faseCode]} · ${cal.tipo}</span></div>
    </div>
    <div class="picker-row">
      <select onchange="selectAthlete(this.value)">${athleteOptionsHTML(athlete.id)}</select>
      ${exercises ? `<button class="btn ${State.logMode?"secondary":""}" onclick="toggleLogMode()">${State.logMode?"Ocultar registro":"Registrar sesión"}</button>` : ""}
    </div>
    ${exercises ? velocityLegendHTML() : ""}
    ${tableAndSave}
  `;
}

function renderSelector(){
  if(State.athletes.length===0) return `<div class="day-block"><div class="empty-msg">Registra al menos un atleta en <b>Panel de Equipo</b> para usar esta sección.<br/><br/><button class="btn big" onclick="setTab('panel')">Ir a Panel de Equipo</button></div></div>`;
  if(!State.selectedAthleteId) State.selectedAthleteId = State.athletes[0].id;
  const athlete = State.athletes.find(a=>a.id===State.selectedAthleteId);
  const cal = CALENDAR.find(c=>c.micro===State.microId);
  const color = PHASE_COLOR[cal.faseCode];
  const dots = CALENDAR.map(c=>`<div class="micro-dot ${c.micro===State.microId?"active":""}" style="color:${PHASE_COLOR[c.faseCode]};background:${c.micro===State.microId?PHASE_COLOR[c.faseCode]:""}" onclick="setMicro(${c.micro})">${c.micro}</div>`).join("");
  
  const days = ["monday","tuesday","wednesday","thursday","friday"].map(day=>{
    let exs = [];
    if(day==="monday") exs = MONDAY(cal);
    else if(day==="tuesday") exs = TUESDAY(cal);
    else if(day==="wednesday") exs = WEDNESDAY(cal);
    else if(day==="thursday") exs = THURSDAY(cal);
    else if(day==="friday") exs = FRIDAY(cal);
    return `<div class="day-block"><div class="day-head"><span>${DAY_LABEL[day]}</span></div>${exerciseTableHTML(exs, athlete, false)}</div>`;
  }).join("");

  return `
    <div class="selector-bar">
      <div><label>Atleta</label><select onchange="selectAthlete(this.value)">${athleteOptionsHTML(athlete.id)}</select></div>
      <div style="flex:1;min-width:220px"><label>Microciclo (1–12)</label><div class="micro-strip">${dots}</div></div>
    </div>
    <div class="cal-info">
      <div class="cal-item"><div class="cal-label">Fase ATR</div><div class="cal-value" style="color:${color}">${cal.fase}</div></div>
      <div class="cal-item"><div class="cal-label">Tipo Microciclo</div><div class="cal-value" style="font-size:12px">${cal.tipo}</div></div>
      <div class="cal-item"><div class="cal-label">Fechas</div><div class="cal-value mono" style="font-size:12px">${fmtDate(cal.start)} – ${fmtDate(cal.end)}</div></div>
      <div class="cal-item"><div class="cal-label">% 1RM Sent. / Banca</div><div class="cal-value">${Math.round(cal.pctSquat*100)}% / ${Math.round(cal.pctBench*100)}%</div></div>
      <div class="cal-item"><div class="cal-label">Volumen</div><div class="cal-value" style="font-size:12px">${cal.volumen}</div></div>
      <div class="cal-item"><div class="cal-label">Pérdida Velocidad</div><div class="cal-value" style="font-size:12px">${cal.perdidaVel}</div></div>
    </div>
    <div style="font-size:12px;color:var(--muted);margin:-6px 0 18px">${cal.enfoque}</div>
    ${velocityLegendHTML()}
    ${days}
  `;
}

async function renderHistorial(){
  if(State.athletes.length===0) return `<div class="day-block"><div class="empty-msg">Registra al menos un atleta en <b>Panel de Equipo</b> para usar esta sección.<br/><br/><button class="btn big" onclick="setTab('panel')">Ir a Panel de Equipo</button></div></div>`;
  if(!State.selectedAthleteId) State.selectedAthleteId = State.athletes[0].id;
  const athlete = State.athletes.find(a=>a.id===State.selectedAthleteId);
  const hist = await loadHistorialFor(athlete.id);
  const logs = await loadLogsFor(athlete.id);

  const squatPoints = hist.map(h=>({y:epley(h.squatKg,h.squatReps), dateLabel:fmtDate(h.date).slice(0,5)}));
  const benchPoints = hist.map(h=>({y:epley(h.benchKg,h.benchReps), dateLabel:fmtDate(h.date).slice(0,5)}));

  const rows = [...hist].reverse().map(h=>`<tr>
    <td data-label="Fecha" class="mono">${fmtDate(h.date)}</td>
    <td data-label="Sentadilla" class="mono">${h.squatKg}kg × ${h.squatReps}</td>
    <td data-label="1RM Sent."><span class="load-pill">${epley(h.squatKg,h.squatReps)} kg</span></td>
    <td data-label="Banca" class="mono">${h.benchKg}kg × ${h.benchReps}</td>
    <td data-label="1RM Banca"><span class="load-pill">${epley(h.benchKg,h.benchReps)} kg</span></td>
    <td data-label="Power Clean" class="mono">${h.halterKg&&h.halterReps?`${h.halterKg}kg × ${h.halterReps}`:"—"}</td>
    <td data-label="1RM Clean"><span class="load-pill">${h.halterKg&&h.halterReps?epley(h.halterKg,h.halterReps)+" kg":"—"}</span></td>
  </tr>`).join("");

  const logsHTML = logs.length===0
    ? `<div style="font-size:12px;color:var(--muted)">Sin registros de ejecución todavía. Regístralos desde "Rutina Hoy".</div>`
    : `<div class="log-list">${logs.map(l=>{
        const rpes = l.entries.map(e=>Number(e.rpe)).filter(v=>!isNaN(v));
        const avg = rpes.length ? (rpes.reduce((a,b)=>a+b,0)/rpes.length).toFixed(1) : "—";
        return `<div class="log-entry"><span>${fmtDate(l.date)} · ${(DAY_LABEL[l.day]||"").split("—")[0].trim()}</span><span class="mono" style="color:var(--muted)">${l.entries.length} ejercicios · RPE prom. ${avg}</span></div>`;
      }).join("")}</div>`;

  return `
    <div class="section-head"><div class="section-title">Historial de 1RM</div><div class="section-note">Progresión por Epley · Registro de sesiones</div></div>
    <div class="picker-row"><select onchange="selectAthlete(this.value)">${athleteOptionsHTML(athlete.id)}</select></div>
    <div class="chart-wrap">
      <div style="font-size:12px;color:var(--muted);margin-bottom:4px">Sentadilla Profunda</div>
      ${miniChartSVG(squatPoints,"var(--acum)")}
      <div style="font-size:12px;color:var(--muted);margin:14px 0 4px">Press de Banca</div>
      ${miniChartSVG(benchPoints,"var(--real)")}
    </div>
    <div class="rm-form">
      <div class="field"><label>Fecha</label><input type="date" id="rm-date" value="${todayISO()}"/></div>
      <div class="field"><label>Sent. kg</label><input type="number" id="rm-squatkg"/></div>
      <div class="field"><label>Sent. reps</label><input type="number" id="rm-squatreps" style="width:70px"/></div>
      <div class="field"><label>Banca kg</label><input type="number" id="rm-benchkg"/></div>
      <div class="field"><label>Banca reps</label><input type="number" id="rm-benchreps" style="width:70px"/></div>
      <div class="field"><label>Power Clean kg</label><input type="number" id="rm-halterkg"/></div>
      <div class="field"><label>Power Clean reps</label><input type="number" id="rm-halterreps" style="width:70px"/></div>
      <button class="btn" onclick="submitRMEntry(${athlete.id})">Agregar Test</button>
    </div>
    <div class="section-head"><div class="section-title" style="font-size:13px">Registros de Test (${hist.length})</div></div>
    <table style="margin-bottom:22px"><thead><tr><th>Fecha</th><th>Sentadilla</th><th>1RM Sent.</th><th>Banca</th><th>1RM Banca</th><th>Power Clean</th><th>1RM Clean</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="section-head"><div class="section-title" style="font-size:13px">Últimas Sesiones Registradas</div></div>
    ${logsHTML}
  `;
}

function submitAddForm(){
  const name = document.getElementById("f-name").value;
  if(!name.trim()){ alert("El nombre es obligatorio."); return; }
  const fields = {
    name, age: document.getElementById("f-age").value, sex: document.getElementById("f-sex").value,
    event: document.getElementById("f-event").value, bw: document.getElementById("f-bw").value,
    squatKg: document.getElementById("f-squatkg").value, squatReps: document.getElementById("f-squatreps").value || 1,
    benchKg: document.getElementById("f-benchkg").value, benchReps: document.getElementById("f-benchreps").value || 1,
    halterKg: document.getElementById("f-halterkg").value, halterReps: document.getElementById("f-halterreps").value || 1,
  };
  addAthlete(fields);
}
function submitRMEntry(athleteId){
  const squatKg = Number(document.getElementById("rm-squatkg").value);
  const squatReps = Number(document.getElementById("rm-squatreps").value);
  const benchKg = Number(document.getElementById("rm-benchkg").value);
  const benchReps = Number(document.getElementById("rm-benchreps").value);
  const halterKg = Number(document.getElementById("rm-halterkg").value);
  const halterReps = Number(document.getElementById("rm-halterreps").value);
  const date = document.getElementById("rm-date").value || todayISO();
  if(!squatKg||!squatReps||!benchKg||!benchReps){ alert("Completa al menos los campos de Sentadilla y Banca."); return; }
  addRMEntry(athleteId, {date, squatKg, squatReps, benchKg, benchReps, halterKg: halterKg||0, halterReps: halterReps||0});
}

async function render(){
  const root = document.getElementById("root");
  let body = "";
  if(State.tab==="panel") body = renderPanel();
  else if(State.tab==="hoy") body = renderHoy();
  else if(State.tab==="selector") body = renderSelector();
  else if(State.tab==="historial") body = await renderHistorial();

  root.innerHTML = `
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark display">AN</div>
          <div><div class="brand-title">Panel de Fuerza ATR</div><div class="brand-sub">Atletismo Nayarit · Bahía de Banderas</div></div>
        </div>
        <div class="tabs">
          <button class="tab ${State.tab==='panel'?'active':''}" onclick="setTab('panel')">Panel Equipo</button>
          <button class="tab ${State.tab==='hoy'?'active':''}" onclick="setTab('hoy')">Rutina Hoy</button>
          <button class="tab ${State.tab==='selector'?'active':''}" onclick="setTab('selector')">Selector Microciclo</button>
          <button class="tab ${State.tab==='historial'?'active':''}" onclick="setTab('historial')">Historial RM</button>
          <button class="tab" onclick="changePin()" title="Configurar PIN de entrenador">🔒 PIN</button>
        </div>
      </div>
      ${body}
      <div class="footer-note">
        1RM calculado por fórmula Epley: 1RM = kg × (1 + 0.0333 × reps). Cargas del microciclo activo tomadas del calendario ATR (7 sep – 29 nov 2026).
        Programación semanal ampliada de Lunes a Viernes con bloques específicos de Core y Estabilidad Lumbopélvica para martes y jueves.
        Ritmo y velocidad de ejecución basados en las zonas carga-velocidad de González-Badillo / Sánchez-Medina.
      </div>
    </div>
    <div id="toast" class="toast" style="display:none;"></div>
  `;
}

initState();
