<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel ATR Adolescentes (15-20) — Estructura Nueva | Atletismo Nayarit</title>
<style>
  :root{
    --bg:#0A0D12; --surface:#12161D; --surface2:#1A2029; --surface3:#212836;
    --line:#2A3140; --text:#EDEFF3; --muted:#8B94A3; --muted2:#5C6472;
    --lane:#E2452C; --ok:#37C77F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
  #root{min-height:100vh;}
  .app{max-width:1280px;margin:0 auto;padding:20px 16px 60px;}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .brand-mark{width:40px;height:40px;border-radius:50%;background:conic-gradient(from 180deg, var(--lane), #7A1E12, var(--lane));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .brand-title{font-weight:700;font-size:18px;letter-spacing:0.02em;}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 14px;border-bottom:1px solid var(--line);padding-bottom:10px;}
  .section-title{font-weight:700;font-size:14px;letter-spacing:0.03em;text-transform:uppercase;}
  .picker-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end;}
  select{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;}
  .day-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;}
  .day-head{background:var(--surface2);padding:12px 16px;font-weight:700;font-size:13px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;color:var(--muted);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.02em;padding:8px 12px;border-bottom:1px solid var(--line);}
  td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .ex-name{font-weight:700;font-size:12.5px;}
  .ex-plano{font-size:10px;color:var(--muted);}
  .ex-enfasis{font-size:9px;color:#D4A574;font-style:italic;margin-top:2px;}
  .load-pill{font-family:monospace;font-weight:700;background:var(--surface3);padding:3px 8px;border-radius:5px;display:inline-block;white-space:nowrap;margin-right:4px;}
  .cal-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
  .cal-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
  .cal-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.02em;}
  .cal-value{font-family:monospace;font-size:13px;font-weight:700;margin-top:3px;}
  .footer-note{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted2);line-height:1.6;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.02em;}
  input[type=number]{background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:monospace;font-size:12px;width:100px;}
  .cometti-block{background:linear-gradient(135deg, #3A2A1A, #2A2015);border:2px solid #D4A574;border-radius:10px;padding:14px;margin:14px 0;color:#FFE;font-family:monospace;font-size:11px;}
  .cometti-title{font-weight:700;font-size:11px;color:#FFE;text-transform:uppercase;letter-spacing:0.02em;margin-bottom:6px;}
  .cometti-step{margin:3px 0;line-height:1.4;}
  .kg-line{margin-top:4px;font-family:monospace;font-size:11px;color:#7FD1A8;}
  .badge-micro{display:inline-block;background:rgba(212,165,116,0.15);color:#D4A574;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;text-transform:uppercase;}

  @media (max-width:640px){
    .app{padding:14px 10px 50px;}
    table{border:none;}
    thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    td{padding:8px 6px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ═══════════════════════════════════════════════════════════════════════════════
// DATOS Y CONSTANTES
// ═══════════════════════════════════════════════════════════════════════════════

const CALENDAR = [
  {micro:1, fase:"Acum", title:"Adaptación Anatómica"},
  {micro:2, fase:"Acum", title:"Hipertrofia-Fuerza"},
  {micro:3, fase:"Acum", title:"Fuerza Máxima I"},
  {micro:4, fase:"Acum", title:"Fuerza Máxima II"},
  {micro:5, fase:"Acum", title:"Recuperación"},
  {micro:6, fase:"Acum", title:"Pico → POTENCIA"},
  {micro:7, fase:"Trans", title:"Carga/Potencia I"},
  {micro:8, fase:"Trans", title:"PAP Moderado"},
  {micro:9, fase:"Trans", title:"Carga/Halterofilia"},
  {micro:10, fase:"Trans", title:"Específico/RFD"},
  {micro:11, fase:"Real", title:"Puesta a Punto"},
  {micro:12, fase:"Real", title:"Competición"},
];

const DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];

const ADO_ADJUSTMENTS = {
  sqIntensity: { m1_2: 0.55, m3_4: 0.75, m5: 0.70, m6_7: 0.80, m8: 0.82, m9_10: 0.75, m11_12: 0.55 },
  comettiIntensity: 0.75,
  comettiCycles: 3,
  comettiRPE: "7-8/10",
};

let state = {
  micro: 6,
  halterKg: 80,
  squatKg: 140,
  benchKg: 90,
  accKg: 40,
};

function loadFor(base, pct) {
  if(!pct) return "—";
  if(base === "squat") return Math.round(state.squatKg * pct);
  if(base === "bench") return Math.round(state.benchKg * pct);
  if(base === "halter") return Math.round(state.halterKg * pct);
  return "—";
}

// Determina contra qué 1RM se calcula cada ejercicio
function refBase(e){
  if(e.nombre.includes("Jump Squat")) return "squat";
  if(/Curl|Tricep|Tríceps|Fondos|Elevaciones|Remo|Face Pull|Lat Pulldown|Press Militar/.test(e.nombre)) return "acc";
  return e.base;
}

// Kg por serie = % × 1RM de referencia (null si no aplica, ej. sóleo, core)
function kgFor(e){
  const b = refBase(e);
  if(!e.pct || b === "fixed") return null;
  if(b === "squat") return Math.round(state.squatKg * e.pct);
  if(b === "bench") return Math.round(state.benchKg * e.pct);
  if(b === "halter") return Math.round(state.halterKg * e.pct);
  if(b === "acc") return Math.round(state.accKg * e.pct);
  return null;
}

// Texto de kg por serie + volumen total (solo si las reps son un número fijo)
function seriesKgHTML(e){
  const kg = kgFor(e);
  if(kg === null) return "";
  let txt = `<div class="kg-line">→ <strong>${kg} kg</strong> por serie`;
  const m = (e.series || "").match(/^(\d+)\s*×\s*(\d+)(?![\d-])/);
  if(m){
    const sets = parseInt(m[1]), reps = parseInt(m[2]);
    const vol = sets * reps * kg;
    txt += ` · vol. ${vol.toLocaleString('es-MX')} kg`;
  }
  return txt + `</div>`;
}

// ═══════════════════════════════════════════════════════════════════════════════
// FUNCIONES POR DÍA
// ═══════════════════════════════════════════════════════════════════════════════

function MONDAY(cal) {
  let ex = [];
  
  // COMETTI FRANCÉS: Solo Micros 6-10
  if(cal.micro >= 6 && cal.micro <= 10) {
    ex.push({
      nombre:"COMETTI FRANCÉS (Adolescentes)",
      plano:"Transferencia RFD máxima",
      enfasis:"Squat 75% → Salto → Drop Jump → Sprint 15m",
      estructura:`3 ciclos | Descanso 2-3 min | RPE 7-8/10`,
      series:"3 ciclos",
      pausa:"2-3 min",
      isCometti:true
    });
  }
  
  // BRACEO DEL CORREDOR: 10 ejercicios
  ex.push(
    {nombre:"Curl Bíceps EZ", plano:"Bíceps I", enfasis:"Flexión ciclo", series:"3 × 6-8 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Curl Alterno", plano:"Bíceps II", enfasis:"Asimetría", series:"3 × 6-8 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Curl Martillo", plano:"Bíceps III", enfasis:"Variante", series:"3 × 6-8 @ 60%", pct:0.60, base:"fixed"},
    {nombre:"Remo Barra Explosivo", plano:"Espalda I", enfasis:"Tracción rápida", series:"3 × 4-5 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Face Pull", plano:"Espalda II", enfasis:"Escapular", series:"3 × 10-12 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Lat Pulldown", plano:"Espalda III", enfasis:"Tracción control", series:"3 × 6-8 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Tricep Press Explosivo", plano:"Tríceps I", enfasis:"Velocidad", series:"3 × 6-8 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Fondos Controlados", plano:"Tríceps II", enfasis:"Potencia", series:"3 × 5-6 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Press Militar", plano:"Hombro I", enfasis:"Coordinación", series:"3 × 5-6 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Elevaciones Laterales", plano:"Hombro II", enfasis:"Movilidad", series:"3 × 8-10 @ 60%", pct:0.60, base:"fixed"}
  );
  
  return ex;
}

function TUESDAY(cal) {
  return [
    {nombre:"Plancha Frontal Dinámica", plano:"Core Anti-Ext I", enfasis:"Estabilidad", series:"3 × 45 seg"},
    {nombre:"Ab Wheel Rollout", plano:"Core Anti-Ext II", enfasis:"Control", series:"3 × 8-10 reps"},
    {nombre:"Pallof Press", plano:"Core Anti-Rot", enfasis:"Rotacional", series:"3 × 10 reps/lado"},
    {nombre:"Russian Twist", plano:"Core Dinámico", enfasis:"Rotación", series:"3 × 15 reps"},
    {nombre:"Single-Leg Calf Raises", plano:"Sóleo I", enfasis:"RFD técnica", series:"3 × 8-10 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Seated Calf Raises", plano:"Sóleo II", enfasis:"Velocidad", series:"3 × 8-10 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Jump Calf Raises", plano:"Sóleo III", enfasis:"Explosividad", series:"3 × 5-6 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Drop Walking", plano:"Sóleo IV", enfasis:"Excéntrico RFD", series:"3 × 30-40 pasos"},
  ];
}

function WEDNESDAY(cal) {
  let sqInt = 0.75, rdlInt = 0.70, hInt = 0.75;
  let sqReps = 4, rdlReps = 4, hReps = 4;
  
  if(cal.micro === 1 || cal.micro === 2) {
    sqInt = 0.55; rdlInt = 0.55; hInt = 0.60;
    sqReps = 8; rdlReps = 8; hReps = 4;
  } else if(cal.micro === 3 || cal.micro === 4) {
    sqInt = 0.75; rdlInt = 0.70; hInt = 0.70;
    sqReps = 4; rdlReps = 4; hReps = 4;
  } else if(cal.micro === 5) {
    sqInt = 0.70; rdlInt = 0.70; hInt = 0.65;
    sqReps = 5; rdlReps = 5; hReps = 4;
  } else if(cal.micro >= 6 && cal.micro <= 7) {
    sqInt = 0.80; rdlInt = 0.70; hInt = 0.75;
    sqReps = 3; rdlReps = 3; hReps = 3;
  } else if(cal.micro === 8) {
    sqInt = 0.82; rdlInt = 0.75; hInt = 0.72;
    sqReps = 3; rdlReps = 3; hReps = 3;
  } else if(cal.micro === 11 || cal.micro === 12) {
    sqInt = 0.55; rdlInt = 0.55; hInt = 0.60;
    sqReps = 3; rdlReps = 3; hReps = 3;
  }
  
  return [
    {nombre:"Sentadilla Explosiva", plano:"Cuádriceps I", enfasis:"RFD", series:`4×${sqReps} @ ${Math.round(sqInt*100)}%`, pct:sqInt, base:"squat"},
    {nombre:"Jump Squat", plano:"Cuádriceps II", enfasis:"Potencia", series:"4 × 4 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"RDL Explosivo", plano:"Femorales I", enfasis:"Cadena posterior", series:`4×${rdlReps} @ ${Math.round(rdlInt*100)}%`, pct:rdlInt, base:"squat"},
    {nombre:"Good Morning Explosivo", plano:"Femorales II", enfasis:"Integración", series:"3 × 4 @ 65%", pct:0.65, base:"squat"},
    {nombre:"Power Snatch", plano:"Halter I", enfasis:"Triple extensión", series:`4×${hReps} @ ${Math.round(hInt*100)}%`, pct:hInt, base:"halter"},
    {nombre:"Power Clean + Press", plano:"Halter II", enfasis:"Sincronización", series:"3 × 3 @ 70%", pct:0.70, base:"halter"},
    {nombre:"Curl Bíceps EZ", plano:"Bíceps I", enfasis:"Flexión", series:"3 × 6-8 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Curl Alterno", plano:"Bíceps II", enfasis:"Asimetría", series:"3 × 6-8 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Curl Martillo", plano:"Bíceps III", enfasis:"Variante", series:"3 × 6-8 @ 60%", pct:0.60, base:"fixed"},
    {nombre:"Remo Barra Explosivo", plano:"Espalda I", enfasis:"Tracción rápida", series:"3 × 4-5 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Face Pull", plano:"Espalda II", enfasis:"Escapular", series:"3 × 10-12 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Lat Pulldown", plano:"Espalda III", enfasis:"Tracción", series:"3 × 6-8 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Hip Thrust con Barra", plano:"Glúteo I", enfasis:"Extensión de cadera", series:"4 × 6-8 @ 70%", pct:0.70, base:"squat"},
    {nombre:"Abducción de Cadera en Polea", plano:"Glúteo II", enfasis:"Glúteo medio", series:"3 × 12-15", base:"fixed"},
  ];
}

function THURSDAY(cal) {
  return [
    {nombre:"Plancha Lateral", plano:"Estabilidad Lateral I", enfasis:"Control", series:"3 × 40 seg/lado"},
    {nombre:"Plancha Lateral + Abd", plano:"Estabilidad Lateral II", enfasis:"Glúteo", series:"3 × 8 reps/lado"},
    {nombre:"Pallof Press", plano:"Core Anti-Rot I", enfasis:"Rotacional", series:"3 × 10 reps/lado"},
    {nombre:"Russian Twist", plano:"Core Anti-Rot II", enfasis:"Control", series:"3 × 15 reps"},
    {nombre:"Nordic Hamstring Curls", plano:"Prevención I", enfasis:"Isquios", series:"3 × 5-6 reps"},
    {nombre:"Copenhagen Plank", plano:"Prevención II", enfasis:"Aductores", series:"3 × 25 seg/lado"},
    {nombre:"Glute Bridge Single-Leg", plano:"Prevención III", enfasis:"Glúteo", series:"3 × 8 reps/lado"},
    {nombre:"Monster Walks", plano:"Propiocepción I", enfasis:"Cadera", series:"3 × 12 pasos c/lado"},
    {nombre:"Bird-Dog Cruzado", plano:"Propiocepción II", enfasis:"Lumbar", series:"3 × 10 reps/lado"},
    {nombre:"Single-Leg Deadlift", plano:"Balance I", enfasis:"Equilibrio", series:"3 × 8 reps/lado"},
  ];
}

function FRIDAY(cal) {
  let sqInt = 0.75, rdlInt = 0.70, hInt = 0.75;
  let sqReps = 4, rdlReps = 4, hReps = 4;
  
  if(cal.micro === 1 || cal.micro === 2) {
    sqInt = 0.55; rdlInt = 0.55; hInt = 0.60;
    sqReps = 8; rdlReps = 8; hReps = 4;
  } else if(cal.micro === 3 || cal.micro === 4) {
    sqInt = 0.75; rdlInt = 0.70; hInt = 0.70;
    sqReps = 4; rdlReps = 4; hReps = 4;
  } else if(cal.micro === 5) {
    sqInt = 0.70; rdlInt = 0.70; hInt = 0.65;
    sqReps = 5; rdlReps = 5; hReps = 4;
  } else if(cal.micro >= 6 && cal.micro <= 7) {
    sqInt = 0.80; rdlInt = 0.70; hInt = 0.75;
    sqReps = 3; rdlReps = 3; hReps = 3;
  } else if(cal.micro === 8) {
    sqInt = 0.82; rdlInt = 0.75; hInt = 0.72;
    sqReps = 3; rdlReps = 3; hReps = 3;
  } else if(cal.micro === 11 || cal.micro === 12) {
    sqInt = 0.55; rdlInt = 0.55; hInt = 0.60;
    sqReps = 3; rdlReps = 3; hReps = 3;
  }
  
  return [
    {nombre:"Sentadilla Explosiva", plano:"Cuádriceps I", enfasis:"RFD", series:`4×${sqReps} @ ${Math.round(sqInt*100)}%`, pct:sqInt, base:"squat"},
    {nombre:"Jump Squat", plano:"Cuádriceps II", enfasis:"Potencia rápida", series:"4 × 4", pct:0.70, base:"fixed"},
    {nombre:"RDL Explosivo", plano:"Isquios I", enfasis:"RFD cadena posterior", series:`4×${rdlReps} @ ${Math.round(rdlInt*100)}%`, pct:rdlInt, base:"squat"},
    {nombre:"Good Morning Explosivo", plano:"Isquios II", enfasis:"Integración", series:"3 × 4 @ 65%", pct:0.65, base:"squat"},
    {nombre:"Power Snatch", plano:"Halter I", enfasis:"Máxima transferencia", series:`4×${hReps} @ ${Math.round(hInt*100)}%`, pct:hInt, base:"halter"},
    {nombre:"Power Clean + Press", plano:"Halter II", enfasis:"Coordinación", series:"3 × 3 @ 70%", pct:0.70, base:"halter"},
    {nombre:"Tricep Press Explosivo", plano:"Tríceps I", enfasis:"Velocidad brazo atrás", series:"3 × 6-8 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Fondos", plano:"Tríceps II", enfasis:"Potencia", series:"3 × 5-6 @ 70%", pct:0.70, base:"fixed"},
    {nombre:"Press Pecho", plano:"Pecho I", enfasis:"Velocidad brazo adelante", series:"3 × 6-8 @ 65%", pct:0.65, base:"bench"},
    {nombre:"Flexiones Explosivas", plano:"Pecho II", enfasis:"Control+velocidad", series:"3 × 6-8", pct:0.70, base:"fixed"},
    {nombre:"Press Militar Explosivo", plano:"Hombro I", enfasis:"Coordinación", series:"3 × 5-6 @ 65%", pct:0.65, base:"fixed"},
    {nombre:"Elevaciones Laterales", plano:"Hombro II", enfasis:"Estabilidad", series:"3 × 8-10 @ 60%", pct:0.60, base:"fixed"},
    {nombre:"Hip Thrust con Barra", plano:"Glúteo I", enfasis:"Potencia de cadera", series:"3 × 6 @ 65%", pct:0.65, base:"squat"},
    {nombre:"Patada de Glúteo en Polea", plano:"Glúteo II", enfasis:"Extensión rápida", series:"3 × 8 c/lado", base:"fixed"},
  ];
}

const DAY_FN = [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY];

function render() {
  const cal = CALENDAR[state.micro - 1];
  
  let html = `
  <div class="app">
    <div class="topbar">
      <div class="brand-mark">⚡</div>
      <div>
        <div class="brand-title">Panel ATR: Adolescentes 15-20</div>
        <div class="brand-sub">Atletismo Nayarit | Estructura Nueva | Basado en Bibliografía</div>
      </div>
    </div>
    
    <div class="section-head">
      <div class="section-title">Configuración</div>
    </div>
    
    <div class="cal-info">
      <div class="cal-item">
        <div class="cal-label">Edad</div>
        <div class="cal-value">15-20 años</div>
      </div>
      <div class="cal-item">
        <div class="cal-label">Microciclo</div>
        <div class="cal-value">${state.micro}</div>
      </div>
      <div class="cal-item">
        <div class="cal-label">Fase</div>
        <div class="cal-value">${cal.fase}</div>
      </div>
      <div class="cal-item">
        <div class="cal-label">Énfasis</div>
        <div class="cal-value" style="font-size:11px;">${cal.title}</div>
      </div>
    </div>
    
    <div class="picker-row">
      <div class="field" style="flex:1;min-width:120px;">
        <label>Microciclo</label>
        <select onchange="state.micro=parseInt(this.value); render();">
  `;
  
  for(let m = 1; m <= 12; m++) {
    html += `<option value="${m}" ${m === state.micro ? 'selected' : ''}>Micro ${m}</option>`;
  }
  
  html += `
        </select>
      </div>
      <div class="field" style="flex:1;min-width:100px;">
        <label>1RM Halter (kg)</label>
        <input type="number" value="${state.halterKg}" onchange="state.halterKg=parseInt(this.value); render();" />
      </div>
      <div class="field" style="flex:1;min-width:100px;">
        <label>1RM Squat (kg)</label>
        <input type="number" value="${state.squatKg}" onchange="state.squatKg=parseInt(this.value); render();" />
      </div>
      <div class="field" style="flex:1;min-width:100px;">
        <label>1RM Bench (kg)</label>
        <input type="number" value="${state.benchKg}" onchange="state.benchKg=parseInt(this.value); render();" />
      </div>
      <div class="field" style="flex:1;min-width:100px;">
        <label>1RM Accesorios (kg)</label>
        <input type="number" value="${state.accKg}" onchange="state.accKg=parseInt(this.value); render();" />
      </div>
    </div>
    
    <div class="footer-note">
      <strong>ESTRUCTURA NUEVA:</strong> Lunes (Cometti + Braceo) | Martes (Core + Sóleo) | <strong>Miércoles (POTENCIA MÁXIMA)</strong> | Jueves (Prevención) | Viernes (Fuerza Rápida). 
      Cargas adolescentes (10-15% menores), RPE 7-8/10, énfasis técnica. 
      <span class="badge-micro">Cometti Lunes Micros 6-10</span>
    </div>
  `;
  
  // RENDERIZAR DÍAS
  for(let d = 0; d < 5; d++) {
    const ex = DAY_FN[d]({...cal});
    
    html += `<div class="day-block">
      <div class="day-head">${DAYS[d]} (${ex.length} ejercicios)</div>
      <table>
        <thead>
          <tr><th>Ejercicio</th><th>Series</th><th>Carga</th></tr>
        </thead>
        <tbody>
    `;
    
    ex.forEach(e => {
      if(e.isCometti) {
        html += `
          <tr style="background:#3A2A1A;">
            <td colspan="3">
              <div class="cometti-block">
                <div class="cometti-title">${e.nombre}</div>
                <div class="cometti-step"><strong>${e.enfasis}</strong></div>
                <div class="cometti-step"><strong>Estructura:</strong> ${e.estructura}</div>
              </div>
            </td>
          </tr>
        `;
      } else {
        const kg = kgFor(e);
        
        html += `
          <tr>
            <td>
              <div class="ex-name">${e.nombre}</div>
              <div class="ex-plano">${e.plano}</div>
              ${e.enfasis ? `<div class="ex-enfasis">${e.enfasis}</div>` : ''}
            </td>
            <td>
              ${e.series || '—'}
              ${seriesKgHTML(e)}
            </td>
            <td>
              ${e.pct ? `<span class="load-pill">${Math.round(e.pct*100)}%</span>` : ''}
              ${kg !== null ? `<span class="load-pill">${kg} kg</span>` : ''}
            </td>
          </tr>
        `;
      }
    });
    
    html += `
        </tbody>
      </table>
    </div>
    `;
  }
  
  html += `</div>`;
  document.getElementById('root').innerHTML = html;
}

render();
</script>
</body>
</html>
